<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Technology Health Dashboard</title>
<!-- Backend host injection point. Empty = same-origin (local dev or WP reverse proxy).
     A future host can pre-inject `window.BACKEND_URL = 'https://av-backend.dts.internal'`
     before this file loads to point at a remote backend without touching this code. -->
<script>window.BACKEND_URL = window.BACKEND_URL || '';</script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #222632;
    --bg-card-hover: #2a2f3d;
    --bg-sidebar: #161922;
    --text-primary: #e8eaf0;
    --text-secondary: #9ca3b4;
    --text-muted: #6b7280;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --green-border: rgba(34,197,94,0.3);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --red-border: rgba(239,68,68,0.3);
    --yellow: #eab308;
    --yellow-bg: rgba(234,179,8,0.12);
    --yellow-border: rgba(234,179,8,0.3);
    --gray: #6b7280;
    --gray-bg: rgba(107,114,128,0.12);
    --gray-border: rgba(107,114,128,0.3);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.12);
    --border: #2d3344;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }
  .topbar-logo span { color: var(--blue); }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .refresh-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .refresh-dot.disconnected {
    background: var(--red);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    min-height: calc(100vh - 49px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 16px;
    margin-bottom: 8px;
  }
  .campus-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .campus-item:hover { background: var(--bg-card); }
  .campus-item.active {
    background: var(--bg-card);
    border-left-color: var(--blue);
  }
  .campus-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .campus-name {
    font-size: 14px;
    font-weight: 500;
  }
  .campus-home-badge {
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-primary);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .campus-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .badge-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .badge-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }

  /* ── Alert Banner ── */
  .alert-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    background: var(--yellow-bg);
    border-bottom: 1px solid var(--yellow-border);
    font-size: 13px;
    color: var(--yellow);
  }
  .alert-banner.visible { display: flex; }
  .alert-banner-dismiss {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--yellow);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
  }

  /* ── Main Content ── */
  .main {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }

  /* ── Page Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-header h1 {
    font-size: 24px;
    font-weight: 700;
  }
  .page-header-stats {
    display: flex;
    gap: 16px;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* ── Section Headers ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    margin-top: 8px;
  }
  .section-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .section-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0 20px;
  }

  /* ── Room Cards Grid ── */
  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .room-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .room-card:hover {
    background: var(--bg-card-hover);
    border-color: #3d4355;
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .room-card-status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .room-card-status-bar.green { background: var(--green); }
  .room-card-status-bar.red { background: var(--red); }
  .room-card-status-bar.yellow { background: var(--yellow); }
  .room-card-status-bar.gray { background: var(--gray); }

  .room-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .room-card-name {
    font-size: 16px;
    font-weight: 600;
  }
  .room-card-status-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .status-icon-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .status-icon-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .status-icon-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .status-icon-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }

  .room-card-devices {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .room-device-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .room-card-issues {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--red);
  }

  /* ── Back Button ── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 16px;
  }
  .back-btn:hover { background: var(--bg-card); color: var(--text-primary); }

  /* ── Room Detail Header ── */
  .room-detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .room-detail-header h1 { font-size: 24px; font-weight: 700; }
  .room-detail-campus {
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
  }

  /* ── Device Cards Grid ── */
  .device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .device-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .device-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .device-card-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .device-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: var(--blue-bg);
    color: var(--blue);
  }
  .device-name {
    font-size: 15px;
    font-weight: 600;
  }
  .device-model {
    font-size: 11px;
    color: var(--text-muted);
  }
  .device-ip-link {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px dotted transparent;
  }
  .device-ip-link:hover { border-bottom-color: var(--blue); }
  .device-status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
  }
  .device-card-body { padding: 16px; }

  /* ── Camera Card ── */
  .camera-feed {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    position: relative;
    overflow: hidden;
  }
  .camera-feed-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .camera-feed-placeholder svg { opacity: 0.4; }
  .ptz-controls {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .ptz-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
  }
  .ptz-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }
  .ptz-center { grid-column: 2; grid-row: 2; }
  .zoom-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .zoom-btn {
    width: 44px; height: 36px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .zoom-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }

  /* ── Camera Session / API Bar ── */
  .cam-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    margin-bottom: 14px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .cam-session-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
  }
  .cam-session-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .cam-api-info {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin-bottom: 14px;
    border: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cam-api-info code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    color: var(--blue);
  }
  .cam-pos-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cam-pos-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cam-pos-value {
    color: var(--text-primary);
    font-weight: 600;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .cam-livescope-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    margin-bottom: 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .cam-livescope-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .cam-livescope-warn { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .cam-livescope-err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .cam-transition-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--yellow);
    font-size: 13px;
    font-weight: 500;
  }
  .cam-transition-spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cam-snapshot-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    z-index: 2;
  }
  .cam-snapshot-btn:hover { background: rgba(0,0,0,0.8); border-color: var(--blue); }

  /* ── Control Buttons ── */
  .control-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .ctrl-btn-green:hover { background: rgba(34,197,94,0.2); }
  .ctrl-btn-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .ctrl-btn-red:hover { background: rgba(239,68,68,0.2); }
  .ctrl-btn-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .ctrl-btn-blue:hover { background: rgba(59,130,246,0.2); }
  .ctrl-btn-neutral { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border); }
  .ctrl-btn-neutral:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .ctrl-btn-active { background: var(--green); color: #000; border-color: var(--green); }

  /* ── Metrics ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .metric-item {
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .metric-value {
    font-size: 18px;
    font-weight: 700;
  }
  .metric-value.ok { color: var(--green); }
  .metric-value.warn { color: var(--yellow); }
  .metric-value.error { color: var(--red); }

  /* ── TV Input Selector ── */
  .input-display {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
  }
  .input-display.correct { background: var(--green-bg); border: 1px solid var(--green-border); }
  .input-display.incorrect { background: var(--red-bg); border: 1px solid var(--red-border); }
  .input-label { font-size: 12px; color: var(--text-muted); }
  .input-value { font-size: 15px; font-weight: 600; }
  .input-value.correct { color: var(--green); }
  .input-value.incorrect { color: var(--red); }
  .input-expected { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .input-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .input-btn {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .input-btn:hover { border-color: var(--blue); color: var(--text-primary); }
  .input-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ── Switch Port Grid ── */
  .port-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 6px;
    margin-bottom: 14px;
  }
  .port-item {
    text-align: center;
    padding: 8px 4px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    font-size: 12px;
    font-weight: 600;
  }
  .port-item .port-num { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }

  /* ── SVG Icons ── */
  .icon { display: inline-block; vertical-align: middle; }

  /* ── Studio (Faculty Podcast) ── */
  .studio-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    margin-bottom: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .preset-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .preset-panel-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .preset-panel-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .preset-panel-sub { font-size: 11px; color: var(--text-muted); }
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .preset-tile {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    position: relative;
  }
  .preset-tile.preset-saved { border-color: var(--green-border, rgba(34,197,94,.4)); }
  .preset-tile.preset-partial { border-color: var(--yellow-border, rgba(234,179,8,.4)); }
  .preset-slot-n { position: absolute; top: 4px; right: 8px; font-size: 10px; color: var(--text-muted); font-family: 'SF Mono', monospace; }
  .preset-name {
    background: transparent; border: none; color: var(--text);
    font-size: 13px; font-weight: 500; padding: 2px 0; width: 100%;
    outline: none; border-bottom: 1px solid transparent;
  }
  .preset-name:hover, .preset-name:focus { border-bottom-color: var(--blue); }
  .preset-actions { display: flex; gap: 4px; }

<body>

<!-- ── Top Bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo"><span>&#9671;</span> AV Health Dashboard</div>
  </div>
  <div class="topbar-right">
    <div class="refresh-indicator">
      <div class="refresh-dot" id="refreshDot"></div>
      <span id="lastRefresh">Connecting…</span>
    </div>
    <span id="connState">Live</span>
  </div>
</div>

<!-- ── Alert Banner ── -->
<div class="alert-banner" id="alertBanner">
  <span>&#9888;</span>
  <span id="alertBannerText"></span>
  <button class="alert-banner-dismiss" onclick="dismissBanner()">&times;</button>
</div>

<!-- ── Layout ── -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Campuses</div>
    <div id="campusList"></div>
  </aside>

  <!-- Main Content -->
  <div class="main" id="mainContent"></div>

</div>

<script>
// ══════════════════════════════════════════════
//  BACKEND WIRING
//
//  CONFIG used to be a static literal in this file.
//  It is now hydrated from the backend's GET /api/rooms
//  on first paint, then continuously patched by
//  Socket.IO `device:update` events.
//
//  All device commands go through cmd(path, body) → POST.
//  No business logic in the browser.
// ══════════════════════════════════════════════

const BACKEND_URL = window.BACKEND_URL || '';

// CONFIG starts empty so render() can run before /api/rooms returns.
let CONFIG = { campuses: [] };

async function cmd(path, body) {
  try {
    const res = await fetch(`${BACKEND_URL}${path}`, {
      method: 'POST',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      const errMsg = (() => { try { return JSON.parse(text).error || text; } catch { return text; } })();
      console.warn('cmd failed', path, res.status, errMsg);
      showToast(`✗ ${path}: ${res.status} ${String(errMsg).slice(0,140)}`, 'error');
      return false;
    }
    return true;
  } catch (err) {
    console.warn('cmd error', path, err);
    showToast(`✗ ${path}: ${err.message}`, 'error');
    return false;
  }
}

// Patch a device in CONFIG by id (campusId + roomId scope guards against id collisions
// between rooms — e.g. cam-1 in multiple rooms).
function patchDeviceInConfig(campusId, roomId, device) {
  const campus = CONFIG.campuses.find(c => c.id === campusId);
  if (!campus) return false;
  const room = campus.rooms.find(r => r.id === roomId);
  if (!room) return false;
  const idx = room.devices.findIndex(d => d.id === device.id);
  if (idx < 0) return false;
  room.devices[idx] = device;
  return true;
}

function setConnState(connected) {
  const dot = document.getElementById('refreshDot');
  const label = document.getElementById('lastRefresh');
  const conn = document.getElementById('connState');
  if (!dot || !label || !conn) return;
  if (connected) {
    dot.classList.remove('disconnected');
    label.textContent = 'Live';
    conn.textContent = 'WebSocket';
  } else {
    dot.classList.add('disconnected');
    label.textContent = 'Disconnected';
    conn.textContent = 'Reconnecting…';
  }
}


// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════

let state = {
  activeCampusId: null,
  currentView: 'dashboard', // 'dashboard' | 'room'
  currentRoomId: null,
  dismissedBanner: false
};

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════

function getDeviceIssues(device) {
  const issues = [];
  if (device.status === 'offline') issues.push('Device offline');
  if (device.status === 'unknown') issues.push('Status unknown (no live poll yet)');
  if (device.type === 'display' && device.power === false) issues.push('Powered off');
  if (device.type === 'display' && device.currentInput !== device.correctInput) issues.push(`Wrong input (${device.currentInput}, expected ${device.correctInput})`);
  if (device.type === 'camera' && device.power === false) issues.push('Camera off');
  if (device.type === 'nuc' && device.power === false) issues.push('NUC off');
  if (device.type === 'nuc' && device.cpu > 80) issues.push('High CPU');
  if (device.type === 'rally-bar' && device.power === false) issues.push('Rally Bar off');
  if (device.type === 'tap' && device.power === false) issues.push('Tap off');
  if (device.type === 'sight' && device.power === false) issues.push('Sight off');
  if (device.type === 'audio' && device.power === false) issues.push('Audio off');
  if (device.type === 'network-switch' && device.ports) {
    const downPorts = device.ports.filter(p => !p.up);
    if (downPorts.length > 0) issues.push(`${downPorts.length} port(s) down`);
  }
  if (device.type === 'pearl') {
    if (device.cpu > 80) issues.push('Pearl CPU high');
    if (device.temp && device.temp > 75) issues.push('Pearl temperature high');
    if (device.storage && (device.storage.freeGb / device.storage.totalGb) < 0.10) issues.push('Pearl storage <10%');
    (device.sources || []).forEach(s => {
      if (!s.connected && s.label && s.label !== '—') issues.push(`Pearl source ${s.name} disconnected`);
    });
  }
  if (device.type === 'mac') {
    if (device.cpu > 80) issues.push('Mac CPU high');
    if (device.mem > 85) issues.push('Mac memory high');
    if (device.disk && (device.disk.freeGb / device.disk.totalGb) < 0.10) issues.push('Mac disk <10%');
  }
  if (device.type === 'rodecaster' && device.status === 'offline') issues.push('Rodecaster not detected on Mac USB');
  if (device.type === 'daw' && !device.sidecarConnected) issues.push('DAW sidecar not connected');
  return issues;
}

function getRoomHealth(room) {
  let totalIssues = 0;
  room.devices.forEach(d => { totalIssues += getDeviceIssues(d).length; });
  if (totalIssues === 0) return 'green';
  if (totalIssues <= 2) return 'yellow';
  return 'red';
}

function getRoomIssueCount(room) {
  let count = 0;
  room.devices.forEach(d => { count += getDeviceIssues(d).length; });
  return count;
}

function getCampusIssueCount(campus) {
  let count = 0;
  campus.rooms.forEach(r => { count += getRoomIssueCount(r); });
  return count;
}

function getDeviceStatusColor(device) {
  return getDeviceIssues(device).length > 0 ? 'red' : 'green';
}

function deviceIcon(type) {
  const icons = {
    camera: '&#9673;',          // camera
    nuc: '&#9634;',             // computer
    'network-switch': '&#8644;', // switch
    display: '&#9632;',         // screen
    'rally-bar': '&#9654;',     // video bar
    tap: '&#9641;',             // touch controller
    sight: '&#9673;',           // AI camera
    audio: '&#9835;',           // audio
    pearl: '&#9210;',           // encoder/recorder
    mac: '&#63743;',            // mac (Apple logo PUA — falls back gracefully)
    rodecaster: '&#9836;',      // mixer
    daw: '&#9835;'              // DAW / console
  };
  return icons[type] || '&#9679;';
}

function deviceTypeName(type) {
  const names = {
    camera: 'Camera', nuc: 'Computer', 'network-switch': 'Switch', display: 'Display',
    'rally-bar': 'Rally Bar', tap: 'Tap Controller', sight: 'Sight Camera', audio: 'Audio',
    pearl: 'Encoder', mac: 'Mac Studio', rodecaster: 'Mixer', daw: 'Studio DAW'
  };
  return names[type] || type;
}

// ══════════════════════════════════════════════
//  RENDER: SIDEBAR
// ══════════════════════════════════════════════

function renderSidebar() {
  const el = document.getElementById('campusList');
  el.innerHTML = CONFIG.campuses.map(c => {
    const issues = getCampusIssueCount(c);
    const active = c.id === state.activeCampusId;
    const badgeClass = issues === 0 ? 'badge-green' : issues <= 3 ? 'badge-yellow' : 'badge-red';
    const badgeText = issues === 0 ? '&#10003;' : `${issues}`;
    return `
      <div class="campus-item ${active ? 'active' : ''}" onclick="switchCampus('${c.id}')">
        <div class="campus-item-left">
          <span class="campus-name">${c.name}</span>
          ${c.isHome ? '<span class="campus-home-badge">HOME</span>' : ''}
        </div>
        <span class="campus-badge ${badgeClass}">${badgeText}</span>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════════════════════
//  RENDER: ALERT BANNER
// ══════════════════════════════════════════════

function renderBanner() {
  if (state.dismissedBanner) return;
  const banner = document.getElementById('alertBanner');
  const homeCampus = CONFIG.campuses.find(c => c.isHome);
  const otherIssues = CONFIG.campuses
    .filter(c => !c.isHome)
    .filter(c => getCampusIssueCount(c) > 0);

  if (otherIssues.length > 0) {
    const text = otherIssues.map(c => `${c.name}: ${getCampusIssueCount(c)} issue(s)`).join(' &middot; ');
    document.getElementById('alertBannerText').innerHTML = text;
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
}

function dismissBanner() {
  state.dismissedBanner = true;
  document.getElementById('alertBanner').classList.remove('visible');
}

// ══════════════════════════════════════════════
//  RENDER: DASHBOARD (Level 1)
// ══════════════════════════════════════════════

function renderDashboard() {
  const campus = CONFIG.campuses.find(c => c.id === state.activeCampusId);
  if (!campus) return;

  const classrooms = campus.rooms.filter(r => r.type === 'classroom');
  const conferences = campus.rooms.filter(r => r.type === 'conference');
  const studios = campus.rooms.filter(r => r.type === 'studio');

  const totalIssues = getCampusIssueCount(campus);
  const healthyRooms = campus.rooms.filter(r => getRoomIssueCount(r) === 0).length;

  const main = document.getElementById('mainContent');

    <div class="page-header">
      <h1>${campus.name} Campus</h1>
      <div class="page-header-stats">
        <div class="stat-chip">
          <div class="stat-dot" style="background: var(--green)"></div>
          ${healthyRooms} Healthy
        </div>
        <div class="stat-chip">
          <div class="stat-dot" style="background: ${totalIssues > 0 ? 'var(--red)' : 'var(--green)'}"></div>
          ${totalIssues} Issue${totalIssues !== 1 ? 's' : ''}
        </div>
        <div class="stat-chip">
          ${campus.rooms.length} Rooms
        </div>
      </div>
    </div>

    <div class="section-header">
      <h2>Classrooms</h2>
      <span class="section-count">${classrooms.length}</span>
    </div>
    <div class="room-grid">
      ${classrooms.map(r => renderRoomCard(r)).join('')}
    </div>

    ${conferences.length > 0 ? `
      <hr class="section-divider">
      <div class="section-header">
        <h2>Conference Rooms</h2>
        <span class="section-count">${conferences.length}</span>
      </div>
      <div class="room-grid">
        ${conferences.map(r => renderRoomCard(r)).join('')}
      </div>

    ${studios.length > 0 ? `
      <hr class="section-divider">
      <div class="section-header">
        <h2>Studios</h2>
        <span class="section-count">${studios.length}</span>

function renderRoomCard(room) {
  const health = getRoomHealth(room);
  const issues = getRoomIssueCount(room);
  const statusIcons = { green: '&#10003;', yellow: '&#9888;', red: '&#10007;' };

  return `
    <div class="room-card" onclick="openRoom('${room.id}')">
      <div class="room-card-status-bar ${health}"></div>
      <div class="room-card-top">
        <span class="room-card-name">${room.name}</span>
        <div class="room-card-status-icon status-icon-${health}">
          ${statusIcons[health]}
        </div>
      </div>
      <div class="room-card-devices">
        ${room.devices.map(d => {
          const color = getDeviceStatusColor(d) === 'green' ? 'var(--green)' : 'var(--red)';
          return `<div class="room-device-pip" style="background:${color}" title="${deviceTypeName(d.type)}: ${d.brand}"></div>`;
        }).join('')}
      </div>
      ${issues > 0 ? `<div class="room-card-issues">${issues} issue${issues !== 1 ? 's' : ''}</div>` : ''}

}

// ══════════════════════════════════════════════
//  RENDER: ROOM DETAIL (Level 2)
// ══════════════════════════════════════════════

function renderRoomDetail(roomId, viewChanged) {
  const campus = CONFIG.campuses.find(c => c.id === state.activeCampusId);
  const room = campus.rooms.find(r => r.id === roomId);
  if (!room) return;

  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <button class="back-btn" onclick="goBack()">&#8592; Back to ${campus.name}</button>
    <div class="room-detail-header">
      <h1>${room.name}</h1>
      <span class="room-detail-campus">${campus.name}</span>
      <span class="campus-badge badge-${getRoomHealth(room)}" style="font-size:12px;">
        ${getRoomIssueCount(room) === 0 ? 'All Clear' : getRoomIssueCount(room) + ' issue(s)'}
      </span>
    </div>
    ${room.type === 'studio' ? renderStudioSessionBar(room) : ''}
    ${room.type === 'studio' && room.devices.some(d => d.type === 'camera') ? `<div id="preset-panel-${room.id}"></div>` : ''}
    <div class="device-grid">
      ${room.devices.map(d => renderDeviceCard(d)).join('')}
    </div>
  `;
  // Room-level multi-cam preset panel: studios only (Faculty Podcast / Tech Talks).
  // Classrooms get 3 per-camera presets rendered inside each camera card instead.
  if (room.type === 'studio' && room.devices.some(d => d.type === 'camera')) {
    if (presetState.has(room.id)) {
      renderPresetPanel(room.id);
    } else if (viewChanged !== false) {
      loadAndRenderPresets(room.id);
    }
  }
  // Classroom per-camera 3-slot preset bars are painted after the card HTML
  // exists in the DOM (renderDeviceCard emits a placeholder div).
  if (room.type !== 'studio') {
    room.devices.filter(d => d.type === 'camera').forEach(cam => {
      // Lazy-load presets for this room then paint the 3 slots for THIS cam.
      if (!presetState.has(room.id)) {
        loadAndRenderPresets(room.id).then(() => paintCamPresetStrip(room.id, cam.id));
      } else {
        paintCamPresetStrip(room.id, cam.id);
      }
    });
  }
}

// ── Per-camera preset strip (for classroom Canon cards) ───
// Reuses the same /api/presets backend, just pins to slots 1-3 of the room's
// preset array and scopes positions to a single camera id.
function paintCamPresetStrip(roomId, cameraId) {
  const host = document.getElementById(`cam-preset-strip-${cameraId}`);
  if (!host) return;
  const data = presetState.get(roomId);
  if (!data) return;
  const slots = data.presets.slice(0, 3);
  host.innerHTML = `
    <div class="cam-preset-label">Presets</div>
    ${slots.map(p => {
      const saved = cameraId in (p.positions || {});
      return `
        <div class="cam-preset-tile ${saved ? 'saved' : 'empty'}">
          <input class="cam-preset-name" value="${escapeAttr(p.name.startsWith('Preset ') ? (p.name.replace('Preset ', '') || '') : p.name)}"
                 data-roomid="${roomId}" data-slot="${p.slot}"
                 onblur="savePresetName(this)" onkeydown="if(event.key==='Enter')this.blur()"
                 title="Rename — press Enter or click away to save">
          <div class="cam-preset-btns">
            <button class="cam-preset-btn cam-preset-recall" onclick="recallCamPreset('${roomId}', ${p.slot}, '${cameraId}')" ${saved ? '' : 'disabled'} title="Move camera to this position">&#9658;</button>
            <button class="cam-preset-btn cam-preset-save" onclick="captureCamPreset('${roomId}', ${p.slot}, '${cameraId}')" title="Save current position">&#128190;</button>
          </div>
        </div>`;
    }).join('')}
  `;
}

// Single-cam capture: read current cam position, PUT the preset with just
// this camera's position (preserves any existing other-cam entries).
async function captureCamPreset(roomId, slot, cameraId) {
  showToast(`Saving preset ${slot}...`, 'info');
  // Read current position from local state (device:update keeps it fresh).
  const room = CONFIG.campuses.flatMap(c => c.rooms).find(r => r.id === roomId);
  const cam = room?.devices.find(d => d.id === cameraId);
  if (!cam) {
    showToast('✗ camera not found', 'error');
    return;
  }
  // Merge with existing positions so we don't wipe other cams' entries.
  const existing = presetState.get(roomId)?.presets.find(p => p.slot === slot)?.positions || {};
  const positions = {
    ...existing,
    [cameraId]: { pan: cam.panPos, tilt: cam.tiltPos, zoom: cam.zoomPos },
  };
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ positions }),
  });
  if (!res.ok) {
    showToast(`✗ save: ${res.status}`, 'error');
    return;
  }
  await loadAndRenderPresets(roomId);
  paintCamPresetStrip(roomId, cameraId);
  showToast(`✓ Preset ${slot} saved`, 'info');
}

async function recallCamPreset(roomId, slot, cameraId) {
  // The room-level /recall endpoint moves every cam in the preset. For a
  // classroom with one camera, that's exactly what we want.
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}/recall`, { method: 'POST' });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    showToast(`✗ recall: ${res.status} ${txt.slice(0,120)}`, 'error');
    return;
  }
  showToast(`✓ Recalled preset ${slot}`, 'info');
}

// ── Multi-cam presets ─────────────────────────────────────
const presetState = new Map(); // roomId → { cameras, presets }

async function loadAndRenderPresets(roomId) {
  try {
    const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}`);
    if (!res.ok) return;
    const data = await res.json();
    presetState.set(roomId, data);
    renderPresetPanel(roomId);
  } catch (err) {
    console.warn('failed to load presets', err);
  }
}

function renderPresetPanel(roomId) {
  const host = document.getElementById(`preset-panel-${roomId}`);
  if (!host) return;
  const data = presetState.get(roomId);
  if (!data) return;
  const camCount = data.cameras.length;
  host.innerHTML = `
    <div class="preset-panel">
      <div class="preset-panel-header">
        <span class="preset-panel-title">&#9680; Multi-Cam Presets</span>
        <span class="preset-panel-sub">Click to recall · double-click name to rename · &#128190; to save current positions (${camCount} cam${camCount === 1 ? '' : 's'})</span>
      </div>
      <div class="preset-grid">
        ${data.presets.map((p) => {
          const saved = Object.keys(p.positions || {}).length;
          const savedCls = saved === camCount && camCount > 0 ? 'preset-saved' : saved > 0 ? 'preset-partial' : 'preset-empty';
          return `
            <div class="preset-tile ${savedCls}">
              <div class="preset-slot-n">${p.slot}</div>
              <input class="preset-name" value="${escapeAttr(p.name)}" data-roomid="${roomId}" data-slot="${p.slot}"
                     onblur="savePresetName(this)" onkeydown="if(event.key==='Enter')this.blur()">
              <div class="preset-actions">
                <button class="preset-btn preset-btn-recall" onclick="recallPreset('${roomId}', ${p.slot})" title="Move all cameras to this preset" ${saved ? '' : 'disabled'}>&#9658; Recall</button>
                <button class="preset-btn preset-btn-save" onclick="capturePreset('${roomId}', ${p.slot})" title="Save current camera positions">&#128190;</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function escapeAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

async function savePresetName(inputEl) {
  const roomId = inputEl.dataset.roomid;
  const slot = Number(inputEl.dataset.slot);
  const name = inputEl.value.trim() || `Preset ${slot}`;
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!res.ok) {
    showToast(`✗ rename preset ${slot}: ${res.status}`, 'error');
  }
  // Refresh local state so re-renders show the new name.
  const data = presetState.get(roomId);
  if (data) {
    const p = data.presets.find((x) => x.slot === slot);
    if (p) p.name = name;
  }
}

async function capturePreset(roomId, slot) {
  showToast(`Capturing positions for preset ${slot}...`, 'info');
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}/capture`, { method: 'POST' });
  if (!res.ok) {
    showToast(`✗ capture: ${res.status}`, 'error');
    return;
  }
  await loadAndRenderPresets(roomId);
  showToast(`✓ Preset ${slot} saved`, 'info');
}

async function recallPreset(roomId, slot) {
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}/recall`, { method: 'POST' });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    showToast(`✗ recall: ${res.status} ${txt.slice(0,120)}`, 'error');
    return;
  }
  const data = await res.json();
  const errs = (data.results || []).filter((r) => r.error);
  if (errs.length) {
    showToast(`⚠ Recall partial: ${errs.length} cam(s) failed`, 'error');
  } else {
    showToast(`✓ Recalled "${data.preset}"`, 'info');
  }
}

function getStudioSession(room) {
  const pearl = room.devices.find(d => d.type === 'pearl');
  if (!pearl) return { live: false, label: 'No Encoder', sub: 'No Pearl device in this room' };
  const recording = (pearl.recorders || []).some(r => r.state === 'recording');
  const streaming = (pearl.publishers || []).some(p => p.state === 'streaming');
  if (recording && streaming) return { live: true, label: 'LIVE — Recording + Streaming', sub: 'Pearl encoder is recording to disk and pushing RTMP' };
  if (recording) return { live: true, label: 'RECORDING', sub: 'Pearl recorder is active' };
  if (streaming) return { live: true, label: 'STREAMING', sub: 'Pearl publisher is active' };
  return { live: false, label: 'Idle', sub: 'No active recording or stream' };
}

function renderStudioSessionBar(room) {
  const sess = getStudioSession(room);
  const liveCls = sess.live ? 'live' : '';
  const sessionPath = sess.live ? 'stop-session' : 'start-session';
  return `
    <div class="studio-session-bar ${liveCls}">
      <div class="studio-session-bar-left">
        <div class="studio-live-dot"></div>
        <div>
          <div class="studio-session-title">${sess.label}</div>
          <div class="studio-session-sub">${sess.sub}</div>
        </div>
      </div>
      <div class="studio-session-actions">
        <button class="ctrl-btn ctrl-btn-${sess.live ? 'red' : 'green'}" onclick="cmd('/api/studio/${room.id}/${sessionPath}')" title="POST /api/studio/${room.id}/${sessionPath}">
          ${sess.live ? '&#9632; Stop Session' : '&#9679; Start Session'}
        </button>
        <button class="ctrl-btn ctrl-btn-neutral" onclick="cmd('/api/studio/${room.id}/prep')" title="POST /api/studio/${room.id}/prep">
          &#9881; Prep Studio
        </button>
      </div>
    </div>
  `;
}

// Turn an IP into a clickable link to the device's own web UI when we know
// one exists. Canon CR-N300 and Epiphan Pearl 2 both serve their admin UI
// on port 80; other device types either have no web UI or live behind VPN
// creds we don't control, so those stay as plain text.
function renderDeviceIpLink(device) {
  const ip = device.ip;
  if (!ip || ip.includes('via ')) return ip; // skip things like "via mac-1 USB"
  const hasWebUi = device.type === 'camera' || device.type === 'pearl';
  if (!hasWebUi) return ip;
  const url = device.type === 'camera' ? `http://${ip}/` : `http://${ip}/`;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="device-ip-link" title="Open ${deviceTypeName(device.type)} admin UI in new tab">${ip} &#8599;</a>`;
}

function renderDeviceCard(device) {
  const issues = getDeviceIssues(device);
  const statusColor = issues.length > 0 ? 'red' : 'green';
  const statusText = issues.length > 0 ? issues[0] : 'Online';
  const badgeClass = statusColor === 'green' ? 'badge-green' : 'badge-red';

  let body = '';

  if (device.type === 'camera') {
    body = renderCameraBody(device);
  } else if (device.type === 'nuc') {
    body = renderNucBody(device);
  } else if (device.type === 'network-switch') {
    body = renderSwitchBody(device);
  } else if (device.type === 'display') {
    body = renderDisplayBody(device);
  } else if (device.type === 'rally-bar' || device.type === 'tap' || device.type === 'sight' || device.type === 'audio') {
    body = renderSimpleDeviceBody(device);
  } else if (device.type === 'pearl') {
    body = renderPearlBody(device);
  } else if (device.type === 'mac') {
    body = renderMacBody(device);
  } else if (device.type === 'rodecaster') {
    body = renderRodecasterBody(device);
  } else if (device.type === 'daw') {
    body = renderDawBody(device);
  }

  return `
    <div class="device-card">
      <div class="device-card-header">
        <div class="device-card-header-left">
          <div class="device-icon">${deviceIcon(device.type)}</div>
          <div>
            <div class="device-name">${device.label ? device.label + ' — ' : deviceTypeName(device.type) + ' — '}${device.brand}</div>
            <div class="device-model">${device.model || ''} &middot; ${renderDeviceIpLink(device)}</div>
          </div>
        </div>
        <span class="device-status-badge ${badgeClass}">${statusText}</span>
      </div>
      <div class="device-card-body">
        ${body}
      </div>
    </div>
  `;
}

function renderCameraBody(device) {
  const isOnline = device.status === 'online';
  const isTransitioning = device.powerTransition != null;

  // Livescope status display
  const lsCode = device.livescopeStatus || 0;
  let lsClass = 'cam-livescope-ok';
  let lsText = `Livescope: ${lsCode} OK`;
  if (!isOnline) { lsClass = 'cam-livescope-err'; lsText = 'Livescope: Unreachable'; }
  else if (lsCode === 301) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 301 — In use by another client'; }
  else if (lsCode === 503) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 503 — Too many clients'; }
  else if (lsCode === 509) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 509 — Standby'; }
  else if (lsCode === 510) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 510 — Entering standby...'; }
  else if (lsCode === 511) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 511 — Waking up...'; }
  else if (lsCode === 507) { lsClass = 'cam-livescope-err'; lsText = 'Livescope: 507 — Auth failed'; }

  // Power state text
  let powerLabel = device.power ? 'Standby' : 'Wake';
  let powerBtnClass = device.power ? 'ctrl-btn-red' : 'ctrl-btn-green';
  if (device.powerTransition === 'standby-pending') { powerLabel = 'Entering Standby...'; powerBtnClass = 'ctrl-btn-neutral'; }
  else if (device.powerTransition === 'waking') { powerLabel = 'Waking Up...'; powerBtnClass = 'ctrl-btn-neutral'; }

  return `
    <div class="camera-feed">
      ${isOnline ? `<button class="cam-snapshot-btn" onclick="window.open(BACKEND_URL + '/api/canon/${device.id}/snapshot', '_blank')" title="GET /api/canon/${device.id}/snapshot">&#128247; Snapshot</button>` : ''}
      ${isTransitioning ? `
        <div class="cam-transition-overlay">
          <div class="cam-transition-spinner"></div>
          <span>${device.powerTransition === 'waking' ? 'Camera starting up...' : 'Camera shutting down...'}</span>
        </div>
      ` : ''}
      ${isOnline
        ? `<div class="cam-preview-slot" data-deviceid="${device.id}" style="width:100%; height:100%; background:#000; position:relative;"></div>`
        : `<div class="camera-feed-placeholder">
             <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
               <rect x="2" y="5" width="15" height="14" rx="2"/>
               <polygon points="22,7 17,12 22,17"/>
             </svg>
             <span>Camera Offline</span>
           </div>`}
    </div>

    <!-- Livescope Status -->
    <div class="cam-livescope-bar ${lsClass}">
      <span>${lsText}</span>
    </div>

    <!-- Session & Control (XC Protocol) -->
    <div class="cam-session-bar">
      <div class="cam-session-bar-left">
        <div class="cam-session-dot" style="background: ${isOnline ? 'var(--green)' : 'var(--red)'}"></div>
        <span>${isOnline ? 'XC Protocol' : 'Unreachable'}</span>
        <span style="color:var(--text-muted); font-size:11px;">${device.auth && device.auth.enabled ? '&#128274; Auth' : '&#128275; Open'}</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="ctrl-btn ctrl-btn-blue" style="padding:4px 10px; font-size:11px;" onclick="cmd('/api/canon/${device.id}/claim')" title="POST /api/canon/${device.id}/claim">
          ${device.controlClaimed ? '&#9679; Control Claimed' : '&#9675; Claim Control'}
        </button>
        <button class="ctrl-btn ctrl-btn-neutral" style="padding:4px 10px; font-size:11px;" onclick="cmd('/api/canon/${device.id}/release')" title="POST /api/canon/${device.id}/release">
          Release
        </button>
      </div>
    </div>

    <!-- PTZ Position Readout (from info.cgi) -->
    <div class="cam-pos-bar">
      <div class="cam-pos-item">Pan <span class="cam-pos-value">${isOnline ? device.panPos + '&deg;' : '—'}</span></div>
      <div class="cam-pos-item">Tilt <span class="cam-pos-value">${isOnline ? device.tiltPos + '&deg;' : '—'}</span></div>
      <div class="cam-pos-item">Zoom <span class="cam-pos-value">${isOnline ? device.zoomPos + '%' : '—'}</span></div>
    </div>

    <!-- PTZ Controls (control.cgi) -->
    <div class="ptz-controls">
      <div></div>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'tilt-up' })" title="Tilt Up">&#9650;</button>
      <div></div>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'pan-left' })" title="Pan Left">&#9664;</button>
      <button class="ptz-btn ptz-center" onclick="cmd('/api/canon/${device.id}/home')" title="Home Preset">&#8962;</button>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'pan-right' })" title="Pan Right">&#9654;</button>
      <div></div>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'tilt-down' })" title="Tilt Down">&#9660;</button>
      <div></div>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="cmd('/api/canon/${device.id}/zoom', { direction: 'out' })" title="Zoom Out">&minus;</button>
      <button class="zoom-btn" onclick="cmd('/api/canon/${device.id}/zoom', { direction: 'in' })" title="Zoom In">&plus;</button>
    </div>

    <!-- 3-slot per-camera presets (classroom rooms only; studios use the room-level multi-cam panel) -->
    <div id="cam-preset-strip-${device.id}" class="cam-preset-strip"></div>

    <!-- Camera Actions -->
    <div class="control-row">
      <button class="ctrl-btn ${device.autoTrack ? 'ctrl-btn-active' : device.autoTrackAvailable ? 'ctrl-btn-green' : 'ctrl-btn-neutral'}"
              onclick="cmd('/api/canon/${device.id}/autotrack', { enabled: ${!device.autoTrack} })"

function renderPearlBody(device) {
  const isOnline = device.status === 'online';
  const recording = (device.recorders || []).some(r => r.state === 'recording');
  const streaming = (device.publishers || []).some(p => p.state === 'streaming');
  const storagePctFree = device.storage ? Math.round((device.storage.freeGb / device.storage.totalGb) * 100) : 0;
  const cpuClass = device.cpu > 80 ? 'error' : device.cpu > 60 ? 'warn' : 'ok';
  const tempClass = device.temp > 75 ? 'error' : device.temp > 65 ? 'warn' : 'ok';
  const storageClass = storagePctFree < 10 ? 'error' : storagePctFree < 25 ? 'warn' : 'ok';

  const activeRec = (device.recorders || []).find(r => r.state === 'recording');
  const pearlDurSec = activeRec ? Math.floor(activeRec.durationSec || 0) : 0;

  // Stash the current "known duration" for the client-side per-second ticker.
  // The ticker reads this on every tick and draws: known + (now - recvTime)/1000.
  pearlRecState.set(device.id, { recording, baseSec: pearlDurSec, baseAt: Date.now() });

  return `
    <!-- One-touch record — mirrors the hardware REC button on the Pearl -->
    <div class="pearl-onetouch ${recording ? 'recording' : ''}">

    <!-- Recent recordings (loaded async; click to play in-browser) -->
    <div id="pearl-recordings-${device.id}" class="pearl-recordings"></div>

    <!-- Encoder state pills -->
    <div class="pearl-state-row">
      ${recording
        ? '<span class="pearl-pill rec"><span class="dot"></span>REC</span>'
        : '<span class="pearl-pill idle">REC OFF</span>'}
      ${streaming
        ? '<span class="pearl-pill stream">&#9673; STREAMING</span>'
        : '<span class="pearl-pill idle">STREAM OFF</span>'}

      <span class="pearl-pill">UP ${device.uptime || '—'}</span>

    <!-- Channels (encoders) -->

function renderSimpleDeviceBody(device) {
  const metrics = [];
  const health = device.healthStatus; // populated from Logitech Sync when available
  const healthCls = health === 'Error' ? 'error' : health === 'Warning' ? 'warn' : health === 'NoIssues' ? 'ok' : '';
  const healthLabel = health === 'NoIssues' ? 'All Clear' : health || '—';

  if (device.type === 'rally-bar') {
    const inCallText = device.inCall ? 'In Meeting' : 'Idle';
    const statusText = device.status === 'online'
      ? (device.inCall ? 'Online · In Call' : 'Online · Idle')
      : 'Offline';
    const statusCls = device.status !== 'online' ? 'error' : device.inCall ? 'warn' : 'ok';
    metrics.push({ label: 'Status', value: statusText, cls: statusCls });
    if (health) metrics.push({ label: 'Sync Health', value: healthLabel, cls: healthCls });
    metrics.push({ label: 'Use', value: inCallText, cls: device.inCall ? 'warn' : 'ok' });
    metrics.push({ label: 'Firmware', value: device.firmware || '—', cls: 'ok' });
  } else if (device.type === 'tap' || device.type === 'sight') {
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Online' : 'Offline', cls: device.status === 'online' ? 'ok' : 'error' });
    if (health) metrics.push({ label: 'Sync Health', value: healthLabel, cls: healthCls });
  } else if (device.type === 'audio') {
    metrics.push({ label: 'Power', value: device.power ? 'On' : 'Off', cls: device.power ? 'ok' : 'error' });
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Reachable' : 'Unreachable', cls: device.status === 'online' ? 'ok' : 'error' });
  }

  // Peripheral mismatch (Rally Bar only) — "expected 2 mic pods, found 1"
  const peripheralAlerts = [];
  if (device.peripherals) {
    for (const [name, pc] of Object.entries(device.peripherals)) {
      if (pc.expected !== pc.actual) {
        peripheralAlerts.push(`${name}: ${pc.actual}/${pc.expected}`);
      }
    }
  }

  return `
    <div class="metrics-grid">
      ${metrics.map(m => `
        <div class="metric-item">
          <div class="metric-label">${m.label}</div>
          <div class="metric-value ${m.cls}">${m.value}</div>
        </div>
      `).join('')}
    </div>
    ${peripheralAlerts.length > 0 ? `
      <div class="device-note" style="color: var(--yellow, #eab308);">
        ⚠ Peripheral mismatch: ${peripheralAlerts.join(' · ')}
      </div>
    ` : ''}
  `;
}

// ══════════════════════════════════════════════
//  RENDER ORCHESTRATOR
// ══════════════════════════════════════════════

// ── Pearl recording live ticker ───────────────────────────
// Pearl's duration only updates every 5s via the poll cycle. We tick locally
// every second by remembering {baseSec, baseAt} at the last poll and adding
// elapsed time since — reset whenever a fresh device:update arrives.
const pearlRecState = new Map(); // deviceId -> { recording, baseSec, baseAt }

function formatHMS(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

setInterval(() => {
  pearlRecState.forEach((st, id) => {
    const el = document.querySelector(`.pearl-rec-time[data-pearlid="${id}"]`);
    if (!el) return;
    if (!st.recording) {
      el.textContent = formatHMS(0);
      return;
    }
    const elapsed = (Date.now() - st.baseAt) / 1000;
    el.textContent = formatHMS(st.baseSec + elapsed);
  });
}, 1000);

// ── Pearl recordings list ─────────────────────────────────
const pearlRecList = new Map(); // deviceId -> { fetchedAt, files }
const RECORDINGS_TTL_MS = 30_000;

async function loadPearlRecordings(deviceId, force) {
  const cached = pearlRecList.get(deviceId);
  if (!force && cached && Date.now() - cached.fetchedAt < RECORDINGS_TTL_MS) {
    return renderPearlRecordings(deviceId);
  }
  try {
    const res = await fetch(`${BACKEND_URL}/api/pearl/${deviceId}/recordings`);
    if (!res.ok) return;
    const data = await res.json();
    pearlRecList.set(deviceId, { fetchedAt: Date.now(), files: data.files || [] });
    renderPearlRecordings(deviceId);
  } catch (err) {
    console.warn('failed to load pearl recordings', err);
  }
}

function renderPearlRecordings(deviceId) {
  const host = document.getElementById(`pearl-recordings-${deviceId}`);
  if (!host) return;
  const cached = pearlRecList.get(deviceId);
  const files = cached?.files || [];
  if (files.length === 0) {
    host.innerHTML = `
      <div class="pearl-recordings-header">
        <span class="pearl-recordings-title">&#9655; Recent Recordings</span>
        <button class="pearl-rec-refresh" onclick="loadPearlRecordings('${deviceId}', true)">&#8635; Refresh</button>
      </div>
      <div class="pearl-recordings-empty">No recordings yet. Hit REC to start.</div>`;
    return;
  }
  // Group by timestamp — a single recording session produces one file per
  // recorder with identical created-time (within a second). Collapse them
  // so the UI shows one row per session with all 3 camera angles under it.
  const groups = new Map();
  for (const f of files) {
    const bucket = String(f.created).slice(0, 16); // minute granularity
    if (!groups.has(bucket)) groups.set(bucket, []);
    groups.get(bucket).push(f);
  }
  const sessions = [...groups.entries()].map(([when, items]) => ({
    when,
    items: items.sort((a, b) => a.recorderId - b.recorderId),
    totalMB: items.reduce((s, f) => s + f.sizeBytes, 0) / 1e6,
    duration: Math.max(...items.map((f) => f.duration)),
  }));
  host.innerHTML = `
    <div class="pearl-recordings-header">
      <span class="pearl-recordings-title">&#9655; Recent Recordings (${files.length} file${files.length === 1 ? '' : 's'} · ${sessions.length} session${sessions.length === 1 ? '' : 's'})</span>
      <button class="pearl-rec-refresh" onclick="loadPearlRecordings('${deviceId}', true)">&#8635; Refresh</button>
    </div>
    <div class="pearl-recordings-list">
      ${sessions.slice(0, 6).map((sess) => `
        <div class="pearl-session">
          <div class="pearl-session-head">
            <span class="pearl-session-when">${new Date(sess.when).toLocaleString([], { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
            <span class="pearl-session-meta">${formatHMS(sess.duration)} · ${sess.totalMB.toFixed(1)} MB</span>
          </div>
          <div class="pearl-session-files">
            ${sess.items.map((f) => `
              <button class="pearl-file-btn" onclick="playPearlFile('${deviceId}', ${f.recorderId}, '${encodeURIComponent(f.id)}', ${JSON.stringify(f.name).replace(/"/g,'&quot;')})">
                &#9658; ${recorderNameShort(f.name)}
              </button>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>`;
}

function recorderNameShort(name) {
  // "Center Camera_Apr20_16-08-45" → "Center"
  const base = String(name).split('_')[0];
  return base.replace(/\s*Camera\s*$/i, '').trim() || base;
}

function playPearlFile(deviceId, recorderId, fileId, displayName) {
  const url = `${BACKEND_URL}/api/pearl/${deviceId}/recordings/${recorderId}/${fileId}/stream`;
  let modal = document.getElementById('pearl-player-modal');
  if (modal) modal.remove();
  modal = document.createElement('div');
  modal.id = 'pearl-player-modal';
  modal.innerHTML = `
    <div class="pearl-player-backdrop" onclick="this.parentElement.remove()"></div>
    <div class="pearl-player-card">
      <div class="pearl-player-head">
        <span>${displayName}</span>
        <button class="pearl-player-close" onclick="this.closest('#pearl-player-modal').remove()">&times;</button>
      </div>
      <video controls autoplay src="${url}" style="width:100%;max-height:70vh;background:#000;"></video>
      <div class="pearl-player-foot">
        <a class="ctrl-btn ctrl-btn-blue" href="${url}" download style="text-decoration:none;">&#11015; Download</a>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

// Persistent <img> cache for MJPEG streams. The render() pipeline rewrites
// innerHTML, which would otherwise tear down the MJPEG <img> every time a
// device:update arrives — causing visible flicker every few seconds.
// We keep one <img> element per device id here and move it via appendChild
// (not clone) into whichever .cam-preview-slot is currently rendered. Moving
// a DOM node doesn't trigger a reload, so the MJPEG connection stays alive.
const camImgCache = new Map();

function attachPersistentCamImgs() {
  document.querySelectorAll('.cam-preview-slot').forEach((slot) => {
    const id = slot.dataset.deviceid;
    if (!id) return;
    let img = camImgCache.get(id);
    if (!img) {
      img = document.createElement('img');
      img.className = 'cam-preview';
      img.alt = 'Live preview';
      img.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block; background:#000;';
      img.src = `${BACKEND_URL}/api/canon/${id}/mjpeg`;
      img.onerror = () => {
        img.style.display = 'none';
        const ph = img.nextElementSibling;
        if (ph) ph.style.display = 'flex';
      };
      img.onload = () => {
        img.style.display = 'block';
        const ph = img.nextElementSibling;
        if (ph) ph.style.display = 'none';
      };
      camImgCache.set(id, img);
    }
    // Placeholder shown while the stream is connecting or failed.
    let ph = slot.querySelector('.camera-feed-placeholder');
    if (!ph) {
      ph = document.createElement('div');
      ph.className = 'camera-feed-placeholder';
      ph.style.display = 'none';
      ph.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="15" height="14" rx="2"/><polygon points="22,7 17,12 22,17"/></svg><span>Preview unavailable — camera may be in standby</span>';
    }
    if (img.parentElement !== slot) slot.appendChild(img);
    if (ph.parentElement !== slot) slot.appendChild(ph);
  });
  // Clean up cached imgs for rooms not currently rendered (frees Canon session slots).
  const visible = new Set([...document.querySelectorAll('.cam-preview-slot')].map((s) => s.dataset.deviceid));
  for (const [id, img] of camImgCache) {
    if (!visible.has(id)) {
      img.src = '';
      img.remove();
      camImgCache.delete(id);
    }
  }
}

let renderTimer = null;
let lastRenderedView = null; // `${view}|${roomId}` — track when the view actually changes
function render() {
  // Real 80ms debounce. Device updates arrive as separate socket events —
  // one per device — so without setTimeout debouncing we full-rewrite
  // mainContent 7x per 5s poll cycle and the page visibly blinks.
  if (renderTimer) return;
  renderTimer = setTimeout(() => {
    renderTimer = null;
    const viewKey = `${state.currentView}|${state.currentRoomId || ''}`;
    const viewChanged = viewKey !== lastRenderedView;
    lastRenderedView = viewKey;
    renderSidebar();
    renderBanner();
    if (state.currentView === 'room' && state.currentRoomId) {
      renderRoomDetail(state.currentRoomId, viewChanged);
    } else {
      renderDashboard();
    }
    attachPersistentCamImgs();
    // Populate Pearl recording lists for any Pearl cards on screen.
    document.querySelectorAll('[id^="pearl-recordings-"]').forEach((el) => {
      const id = el.id.replace('pearl-recordings-', '');
      loadPearlRecordings(id, false);
    });
  }, 80);
}

// ══════════════════════════════════════════════
//  HASH ROUTING
// ══════════════════════════════════════════════

function parseHash() {
  const hash = window.location.hash.replace('#', '');
  if (!hash) return;
  const parts = hash.split('/');
  const campusId = parts[0];
  const roomId = parts[1] || null;
  if (CONFIG.campuses.find(c => c.id === campusId)) {
    state.activeCampusId = campusId;
    if (roomId) {
      state.currentView = 'room';
      state.currentRoomId = roomId;
    } else {
      state.currentView = 'dashboard';
      state.currentRoomId = null;
    }
  }
}

// ══════════════════════════════════════════════
//  INIT
//
//  1. Fetch initial state via REST so the page paints
//     even if Socket.IO can't reach the server (e.g.
//     when WP iframes the dashboard but the WS proxy
//     isn't wired up yet).
//  2. Open the WebSocket and replace state on
//     `state:initial`, patch on `device:update`.
//  3. The refresh dot doubles as a connection indicator.
// ══════════════════════════════════════════════

function pickInitialCampus() {
  if (state.activeCampusId) return; // already set by hash
  const homeCampus = CONFIG.campuses.find(c => c.isHome);
  state.activeCampusId = homeCampus ? homeCampus.id : (CONFIG.campuses[0] && CONFIG.campuses[0].id) || null;
}

async function bootstrap() {
  // Initial REST snapshot
  try {
    const res = await fetch(`${BACKEND_URL}/api/rooms`);
    if (res.ok) {
      CONFIG = await res.json();
    } else {
      console.warn('GET /api/rooms failed', res.status);
    }
  } catch (err) {
    console.warn('GET /api/rooms error', err);
  }

  pickInitialCampus();
  parseHash();
  render();

  // Open the websocket. typeof check so we don't crash if
  // socket.io.js failed to load (e.g. cross-origin without proxy).
  if (typeof io === 'function') {
    const socket = io(BACKEND_URL || undefined, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => setConnState(true));
    socket.on('disconnect', () => setConnState(false));
    socket.on('connect_error', () => setConnState(false));

    socket.on('state:initial', (snapshot) => {
      CONFIG = snapshot;
      pickInitialCampus();
      render();
    });

    socket.on('device:update', ({ campusId, roomId, device }) => {
      if (patchDeviceInConfig(campusId, roomId, device)) {
        // Re-render only if user is currently looking at the affected room or dashboard.
        if (state.currentView === 'dashboard' || state.currentRoomId === roomId) {
          render();
        }
      }
    });

    socket.on('device:error', ({ deviceId, error }) => {
      console.warn('device error', deviceId, error);
    });
  } else {
    console.warn('socket.io client not loaded; running in REST-only mode');
    setConnState(false);
  }

  window.addEventListener('hashchange', () => {
    parseHash();
    render();
  });

  // Live camera previews are now true MJPEG streams (multipart/x-mixed-replace),
  // so the browser handles per-frame updates — no JS polling needed.
}

function showToast(msg, kind) {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:420px;';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `background:${kind === 'error' ? '#b91c1c' : '#1e3a8a'};color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;font-family:-apple-system,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:toastIn .15s ease-out;`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 4500);
}

bootstrap();
</script>
