// Collapse adjacent L/R pairs (same base name ending in " L"/" R") into one
// logical meter. Keeps the underlying strip channels intact for the recorder,
// just tidier in the UI — the Rodecaster duplicates each mono mic across two
// channels so showing 14 bars would double-count every mic.
function groupDawStrips(strips) {
  const groups = [];
  for (let i = 0; i < strips.length; i++) {
    const s = strips[i], n = strips[i+1];
    const isPair = n && s.name.endsWith(' L') && n.name.endsWith(' R') &&
                   s.name.slice(0, -2) === n.name.slice(0, -2);
    if (isPair) {
      groups.push({ label: s.name.slice(0, -2), indices: [i, i+1], muted: s.muted && n.muted });
      i++; // consume R
    } else {
      groups.push({ label: s.name, indices: [i], muted: !!s.muted });
    }
  }
  return groups;
}

function renderDawBody(device) {
  const sidecar = !!device.sidecarConnected;
  const rec = device.recording || { active: false, durationSec: 0 };
  const strips = device.strips || [];
  const groups = groupDawStrips(strips);
  const activeStrips = groups.filter(g => !g.muted).length;
  const durSec = Math.floor(rec.durationSec || 0);
  const durStr = `${Math.floor(durSec/60)}:${String(durSec%60).padStart(2,'0')}`;

  const formatPeak = p => (p == null || p <= -120) ? '—' : (p >= 0 ? '0' : p.toFixed(0)) + ' dB';
  // Map -60 dB → 0%, 0 dB → 100%. Values below -60 clamp to 0.
  const meterPct = p => (p == null) ? 0 : Math.max(0, Math.min(100, ((p + 60) / 60) * 100));

  // Sidecar self-reported health. Empty string when healthy so the bar stays
  // clean — only render badges when something needs attention.
  const healthBadges = [];
  if (sidecar) {
    if (device.micState && device.micState !== 'granted' && device.micState !== 'n/a') {
      healthBadges.push(`<span class="daw-pill daw-pill-error" title="Sidecar TCC microphone permission state">Mic ${device.micState}</span>`);
    }
    if (device.deviceState === 'missing') {
      healthBadges.push(`<span class="daw-pill daw-pill-error" title="RØDECaster Pro II not enumerable from sounddevice — check USB">Capture device missing</span>`);
    }
    // Stale audio: sidecar is connected and device claims present, but no
    // non-zero sample for >5s. Most likely a USB hiccup that hasn't tripped
    // the supervisor's tear-down yet.
    if (device.deviceState === 'present' && device.lastPeakAgeMs != null && device.lastPeakAgeMs > 5000) {
      const sec = Math.round(device.lastPeakAgeMs / 1000);
      healthBadges.push(`<span class="daw-pill daw-pill-warn" title="No audio samples for ${sec}s — capture stream may have stalled">Audio stale ${sec}s</span>`);
    }
  }
  const badgesHtml = healthBadges.length ? `<span class="daw-pill-row">${healthBadges.join('')}</span>` : '';

  // Recording error: pre-flight refusal (disk full, output dir not writable,
  // can't open WAV writers, etc.) is sticky on `recording.error` until the
  // next record-start attempt. Surface it in the Recording cell.
  const recError = rec.error || null;
  const recValue = recError
    ? `<span title="${escapeAttr(recError)}">Error</span>`
    : (rec.active ? '&#11044; REC ' + durStr : 'Idle');
  const recCls = recError ? 'error' : (rec.active ? 'error' : '');

  return `
    <!-- Sidecar connection bar -->
    <div class="rcp-conn-bar">
      <div class="cam-session-dot" style="background: ${sidecar ? 'var(--green)' : 'var(--red)'}"></div>
      <span>${sidecar ? `Sidecar connected${device.sidecarVersion ? ' · v' + device.sidecarVersion : ''}` : 'Sidecar not connected — start studio-daw on the Mac'}</span>
      ${badgesHtml}
      <span style="color:var(--text-muted); margin-left:auto;">${device.captureDevice || '—'} &middot; ${(device.sampleRate||0)/1000}kHz</span>
    </div>

    <!-- Summary metrics -->
    <div class="metrics-grid" style="margin-top:10px;">
      <div class="metric-item">
        <div class="metric-label">Sources</div>
        <div class="metric-value ok">${activeStrips} / ${groups.length} active</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Recording</div>
        <div class="metric-value ${recCls}">${recValue}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Monitor</div>
        <div class="metric-value ${device.monitoring ? 'ok' : ''}">${device.monitoring ? 'On' : 'Off'}</div>
      </div>
    </div>
    ${recError ? `<div class="device-note" style="color:var(--red); font-size:11px;">Last record-start refused: ${escapeAttr(recError)}</div>` : ''}

    <!-- Output folder — where the sidecar writes one WAV per channel. -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin:12px 0 6px;">Output Folder</div>
    <div class="daw-outdir-row">
      <input type="text" class="daw-outdir-input" data-daw-id="${device.id}"
             value="${device.outputDir || ''}"
             placeholder="~/Documents/studio-daw-recordings"
             spellcheck="false" autocomplete="off" />
      <button class="ctrl-btn ctrl-btn-neutral daw-outdir-browse" data-daw-id="${device.id}">Browse…</button>
      <button class="ctrl-btn ctrl-btn-neutral daw-outdir-save" data-daw-id="${device.id}">Save</button>
    </div>
    <div class="device-note" style="font-size:10px;">
      Each channel is written to its own mono 24-bit WAV under a timestamped subfolder, so DAWs that don't import multichannel (GarageBand) can still pull each mic into a track.
    </div>

    <!-- Recent Recordings: lists studio_<ts>/ session subdirs under outputDir.
         Populated lazily on render via loadDawRecordings(). Refreshes when a
         record-stop event lands (handler at the bottom of this file). -->
    <div id="daw-recordings-${device.id}" class="pearl-recordings"></div>

    <!-- Live per-channel input levels (driven by sidecar 'levels' events) -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin:12px 0 6px;">Input Levels</div>
    <div class="rcp-strip-list">
      ${groups.map(g => {
        const peak = Math.max(...g.indices.map(i => strips[i]?.peakDb ?? -120));
        const chLabel = g.indices.length === 2 ? ` · ch ${g.indices[0]+1}-${g.indices[1]+1}` : ` · ch ${g.indices[0]+1}`;
        return `
        <div class="rcp-strip ${g.muted ? 'muted' : ''}" data-group-indices="${g.indices.join(',')}">
          <span class="rcp-strip-name">${g.label}<span style="color:var(--text-muted); font-weight:400; font-size:10px;">${chLabel}</span></span>
          <div class="rcp-meter">
            <div class="rcp-meter-fill" style="width:${meterPct(peak)}%"></div>
          </div>
          <span class="rcp-strip-icon">${g.muted ? '&#128263;' : ''}</span>
        </div>
        `;
      }).join('')}
    </div>
  `;
}

// ── AV.io 4K capture card ──────────────────────────────────
// Big live preview of the Pearl's HDMI 1 program output. The MJPEG stream is
// served by the sidecar's loopback HTTP, proxied through /api/avio/:id/mjpeg.
// Polls /snapshot at ~10 FPS instead of using multipart/x-mixed-replace MJPEG
// in <img>. Reason: Chrome's MJPEG-in-img support has been progressively
// restricted; tested empirically and even direct top-level navigation to the
// MJPEG URL no longer renders subsequent frames. Polling cached snapshots is
// browser-agnostic and the sidecar's continuous-capture loop keeps the
// snapshot O(1) so we don't burn CPU on per-poll ffmpeg startups.
function renderAvioBody(device) {
  const online = device.sidecarReachable;
  const snapshotUrl = `${BACKEND_URL}/api/avio/${device.id}/snapshot`;
  const whepUrl     = `${BACKEND_URL}/api/avio/${device.id}/whep`;
  // Source switcher — current Pearl HDMI output mapping. The buttons drive
  // POST /api/avio/:id/source, which writes Pearl's outputs/<port>/settings
  // and kicks ffmpeg so AV.io renegotiates the HDMI link.
  const currentSource = device.currentSource || null;
  const sources = [
    { id: 'multiview', label: 'Multi-view' },
    { id: '1',         label: 'Center Camera' },
    { id: '2',         label: 'Left Camera' },
    { id: '3',         label: 'Right Camera' },
  ];
  const switcherHtml = `
    <div class="avio-switcher">
      <span class="avio-switcher-label">Pearl HDMI 1 source:</span>
      ${sources.map((s) => `
        <button class="ctrl-btn ${currentSource === s.id ? 'ctrl-btn-active' : 'ctrl-btn-neutral'}"
                onclick="setAvioSource('${device.id}', '${s.id}')"
                ${online ? '' : 'disabled'}
                title="POST /api/avio/${device.id}/source { source: '${s.id}' }">
          ${s.label}
        </button>
      `).join('')}
    </div>
  `;

  return `
    ${switcherHtml}
    <div class="avio-preview" style="position:relative; width:100%; background:#000; aspect-ratio:16/9; border-radius:6px; overflow:hidden;">
      ${online ? `
        <div class="avio-whep-slot" data-deviceid="${device.id}" data-whep-url="${whepUrl}" style="width:100%; height:100%; position:relative;"></div>
        <button class="cam-snapshot-btn" onclick="window.open('${snapshotUrl}?t=' + Date.now(), '_blank')" title="GET ${snapshotUrl}">&#128247; Snapshot</button>
      ` : `
        <div class="camera-feed-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="5" width="15" height="14" rx="2"/>
            <polygon points="22,7 17,12 22,17"/>
          </svg>
          <span>Sidecar unreachable — capture daemon not running</span>
        </div>
      `}
    </div>
    <div class="rcp-conn-bar" style="margin-top:8px;">
      <div class="cam-session-dot" style="background: ${online ? 'var(--green)' : 'var(--red)'}"></div>
      <span>${online ? 'Capture online' : 'Sidecar offline'}</span>
      <span style="color:var(--text-muted); margin-left:auto;">${device.currentSourceLabel || device.sourceLabel || '—'} &middot; via ${device.sidecarHost}</span>
    </div>
  `;
}

// Click handler for the source-switcher buttons. POSTs to /source, which
// changes Pearl's output AND kicks the sidecar's ffmpeg. The kick tears
// down the RTSP push to go2rtc, which causes our WebRTC connection to
// disconnect — the auto-reconnect in startAvioWhep handles re-establishing
// the stream once the new ffmpeg + RTSP session comes back (~1-2s).
async function setAvioSource(deviceId, sourceId) {
  const slot = document.querySelector(`.avio-whep-slot[data-deviceid="${deviceId}"]`);
  const video = slot?.querySelector('video');
  if (video) video.style.opacity = '0.4';
  // Proactively close the current WebRTC connection so we don't sit on a
  // dead one while waiting for the reconnect timer.
  const entry = avioWhepCache.get(deviceId);
  if (entry?.pc) {
    try { entry.pc.close(); } catch {}
    entry.pc = null;
  }
  try {
    const res = await fetch(`${BACKEND_URL}/api/avio/${deviceId}/source`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: sourceId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (err) {
    console.warn('avio source switch failed', err);
    alert('Source switch failed: ' + (err.message || err));
  } finally {
    // attachPersistentAvioImgs re-checks for connections each render — and
    // since we cleared entry.pc above, it'll spin up a fresh WHEP session
    // automatically. Bring the opacity back after the typical reconnect time.
    setTimeout(() => {
      if (video) video.style.opacity = '1';
      if (entry && !entry.pc && !entry.starting && entry.video.isConnected) {
        startAvioWhep(entry).catch(() => {});
      }
    }, 1800);
  }
}

// ── AV.io poll loop ────────────────────────────────────────
// One persistent <img> per device, swapping src to /snapshot?t=<ms> every
// AVIO_POLL_MS. Survives device:update rerenders the same way as the Canon
// persistent-<img> cache — but each poll is a fresh HTTP request against
// the cached frame endpoint, so the <img> can't get into a "first-frame-
// stuck" state like multipart/x-mixed-replace does.
// One active RTCPeerConnection per AV.io device. Survives device:update
// rerenders the same way camImgCache does for Canon previews — the <video>
// node gets reparented into the new slot without tearing down the WebRTC
// session, so the dashboard's frequent full renders don't cause a fresh
// SDP handshake + AV.io→ffmpeg→go2rtc startup every time.
const avioWhepCache = new Map();   // deviceId -> { video, pc, whepUrl }

function attachPersistentAvioImgs() {
  document.querySelectorAll('.avio-whep-slot').forEach((slot) => {
    const id = slot.dataset.deviceid;
    const whepUrl = slot.dataset.whepUrl;
    if (!id || !whepUrl) return;
    let entry = avioWhepCache.get(id);
    if (!entry) {
      const video = document.createElement('video');
      video.className = 'avio-preview-video';
      video.autoplay = true;
      video.muted = true;        // required for autoplay without user gesture
      video.playsInline = true;
      video.controls = false;
      video.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block; background:#000;';
      // The actual SDP handshake happens lazily once the <video> is attached.
      entry = { video, pc: null, whepUrl, starting: false };
      avioWhepCache.set(id, entry);
    }
    if (entry.video.parentElement !== slot) slot.appendChild(entry.video);
    // (Re)connect WebRTC if not already connected. The connection survives
    // dashboard rerenders — the <video> just gets moved between slots.
    if (!entry.pc && !entry.starting) {
      startAvioWhep(entry).catch((err) => {
        console.warn('avio WHEP connect failed', err);
      });
    }
  });
  // Clean up: device no longer rendered → tear down the peer connection so
  // go2rtc can release its consumer slot.
  const visible = new Set([...document.querySelectorAll('.avio-whep-slot')].map((s) => s.dataset.deviceid));
  for (const [id, entry] of avioWhepCache) {
    if (!visible.has(id)) {
      try { entry.pc?.close(); } catch {}
      entry.video.srcObject = null;
      entry.video.remove();
      avioWhepCache.delete(id);
    }
  }
}

// WHEP client. Reads the SDP-over-HTTP signaling protocol that go2rtc speaks
// via /api/avio/:id/whep (which proxies to go2rtc /api/whep). Media itself
// flows directly browser ↔ go2rtc over ICE — this is just the handshake.
async function startAvioWhep(entry) {
  entry.starting = true;
  try {
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
      bundlePolicy: 'max-bundle',
    });
    // Receive-only — we never send media back to go2rtc.
    const vTrx = pc.addTransceiver('video', { direction: 'recvonly' });
    const aTrx = pc.addTransceiver('audio', { direction: 'recvonly' });
    // Pin the browser's WebRTC jitter buffer to its minimum. Chrome's default
    // is adaptive (grows up to ~500-1000ms under packet jitter) which is
    // right for conferencing but a major contributor to lag for a local
    // monitoring feed where the source is on the same LAN with no real packet
    // loss. We set BOTH the older playoutDelayHint (hint, Chrome ≥90) and
    // the newer jitterBufferTarget (stricter, Chrome ≥110). The newer API
    // actually enforces a target buffer depth in ms; 0 = flush as soon as
    // packets arrive in decoder order.
    try { vTrx.receiver.playoutDelayHint = 0; } catch {}
    try { aTrx.receiver.playoutDelayHint = 0; } catch {}
    try { vTrx.receiver.jitterBufferTarget = 0; } catch {}
    try { aTrx.receiver.jitterBufferTarget = 0; } catch {}
    pc.ontrack = (ev) => {
      // First track event populates the <video>'s MediaStream. Subsequent
      // events (e.g. audio after video) just add to the same stream.
      if (entry.video.srcObject !== ev.streams[0]) {
        entry.video.srcObject = ev.streams[0];
      }
    };
    pc.onconnectionstatechange = () => {
      console.debug('avio WHEP state:', pc.connectionState);
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        // Auto-reconnect on failure — common after the sidecar kicks ffmpeg
        // during a source switch.
        setTimeout(() => {
          if (entry.pc === pc) {
            try { pc.close(); } catch {}
            entry.pc = null;
            entry.starting = false;
            if (entry.video.isConnected) startAvioWhep(entry).catch(() => {});
          }
        }, 1500);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // Wait for ICE gathering to complete so the offer SDP carries all our
    // candidates. go2rtc's WHEP doesn't support trickle ICE.
    await new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const handler = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', handler);
          resolve();
        }
      };
      pc.addEventListener('icegatheringstatechange', handler);
      // Hard timeout — if ICE never completes (firewall, etc.) we still send
      // what we have. Browser handles trickle internally if go2rtc cooperates.
      setTimeout(resolve, 1500);
    });

    const res = await fetch(entry.whepUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }),
    });
    if (!res.ok) throw new Error(`WHEP ${res.status}: ${await res.text()}`);
    const answer = await res.json();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
    entry.pc = pc;
  } finally {
    entry.starting = false;
  }
}

function renderSimpleDeviceBody(device) {
  const metrics = [];
  const health = device.healthStatus; // populated from Logitech Sync when available
  const healthCls = health === 'Error' ? 'error' : health === 'Warning' ? 'warn' : health === 'NoIssues' ? 'ok' : '';
  const healthLabel = health === 'NoIssues' ? 'All Clear' : health || '—';

  if (device.type === 'rally-bar') {
    const stateText = device.deviceState === 'IN_USE' ? 'In Call' : device.deviceState === 'AUDIO_ONLY' ? 'Audio Only' : device.deviceState === 'IDLE' ? 'Idle' : device.inCall ? 'In Meeting' : 'Idle';
    const statusText = device.status === 'online' ? `Online · ${stateText}` : 'Offline';
    const statusCls = device.status !== 'online' ? 'error' : (device.deviceState === 'IN_USE' || device.inCall) ? 'warn' : 'ok';
    metrics.push({ label: 'Status', value: statusText, cls: statusCls });
    if (health) metrics.push({ label: 'Sync Health', value: healthLabel, cls: healthCls });
    // Live from CollabOS local API (only populated when Local Network Access is enabled)
    if (device.micMuted !== undefined) {
      metrics.push({ label: 'Mic', value: device.micMuted ? 'MUTED' : 'Unmuted', cls: device.micMuted ? 'warn' : 'ok' });
    }
    if (device.speakerVolume !== undefined) {
      const volText = device.speakerMuted ? 'MUTED' : `${device.speakerVolume}/${device.speakerMaxVolume || 10}`;
      metrics.push({ label: 'Speaker', value: volText, cls: device.speakerMuted ? 'warn' : 'ok' });
    }
    if (device.occupancyCount !== undefined) {
      metrics.push({ label: 'People', value: String(device.occupancyCount), cls: device.occupancyCount > 0 ? 'warn' : 'ok' });
    }
    metrics.push({ label: 'Firmware', value: device.firmware || '—', cls: 'ok' });
  } else if (device.type === 'tap' || device.type === 'sight') {
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Online' : 'Offline', cls: device.status === 'online' ? 'ok' : 'error' });
    if (health) metrics.push({ label: 'Sync Health', value: healthLabel, cls: healthCls });
  } else if (device.type === 'audio') {
    metrics.push({ label: 'Power', value: device.power ? 'On' : 'Off', cls: device.power ? 'ok' : 'error' });
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Reachable' : 'Unreachable', cls: device.status === 'online' ? 'ok' : 'error' });
  }

  // Peripheral mismatch (Rally Bar only) — "expected 2 mic pods, found 1"
  const peripheralAlerts = [];
  if (device.peripherals) {
    for (const [name, pc] of Object.entries(device.peripherals)) {
      if (pc.expected !== pc.actual) {
        peripheralAlerts.push(`${name}: ${pc.actual}/${pc.expected}`);
      }
    }
  }

  return `
    <div class="metrics-grid">
      ${metrics.map(m => `
        <div class="metric-item">
          <div class="metric-label">${m.label}</div>
          <div class="metric-value ${m.cls}">${m.value}</div>
        </div>
      `).join('')}
    </div>
    ${peripheralAlerts.length > 0 ? `
      <div class="device-note" style="color: var(--yellow, #eab308);">
        ⚠ Peripheral mismatch: ${peripheralAlerts.join(' · ')}
      </div>
    ` : ''}
    ${device.type === 'rally-bar' && device.environmental ? `
      <div class="device-note">
        <strong>Environmental:</strong>
        ${device.environmental.co2 !== undefined ? ` CO₂ ${device.environmental.co2} ppm · ` : ''}
        ${device.environmental.tempC !== undefined ? `${Math.round(device.environmental.tempC * 9/5 + 32)}°F · ` : ''}
        ${device.environmental.humidity !== undefined ? `${Math.round(device.environmental.humidity)}% humidity` : ''}
        ${device.environmental.presence ? ` · ${device.environmental.presence}` : ''}
      </div>
    ` : ''}
    ${device.type === 'rally-bar' && device.connectedDisplays?.length ? `
      <div class="device-note">
        <strong>Displays:</strong> ${device.connectedDisplays.map(d => `HDMI${d.hdmiPort}: ${d.width}×${d.height}@${d.refreshRate}Hz`).join(', ')}
      </div>
    ` : ''}
    ${device.type === 'rally-bar' && device.connectedUsbDevices?.length ? `
      <div class="device-note">
        <strong>USB:</strong> ${device.connectedUsbDevices.map(u => u.name).join(', ')}
      </div>
    ` : ''}
    ${device.type === 'rally-bar' && device.serial ? `
      <div class="device-note" style="color: var(--text-muted); font-size: 11px;">
        S/N ${device.serial} · ${device.hostName || ''}
      </div>
    ` : ''}
  `;
}

// ── Pearl recording live ticker ───────────────────────────
// Pearl's duration only updates every 5s via the poll cycle. We tick locally
// every second by remembering {baseSec, baseAt} at the last poll and adding
// elapsed time since — reset whenever a fresh device:update arrives.
const pearlRecState = new Map(); // deviceId -> { recording, baseSec, baseAt }

function formatHMS(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

setInterval(() => {
  pearlRecState.forEach((st, id) => {
    const el = document.querySelector(`.pearl-rec-time[data-pearlid="${id}"]`);
    if (!el) return;
    if (!st.recording) {
      el.textContent = formatHMS(0);
      return;
    }
    const elapsed = (Date.now() - st.baseAt) / 1000;
    el.textContent = formatHMS(st.baseSec + elapsed);
  });
}, 1000);

// ── Pearl recordings list ─────────────────────────────────
const pearlRecList = new Map(); // deviceId -> { fetchedAt, files }
const RECORDINGS_TTL_MS = 30_000;

async function loadPearlRecordings(deviceId, force) {
  const cached = pearlRecList.get(deviceId);
  if (!force && cached && Date.now() - cached.fetchedAt < RECORDINGS_TTL_MS) {
    return renderPearlRecordings(deviceId);
  }
  try {
    const res = await fetch(`${BACKEND_URL}/api/pearl/${deviceId}/recordings`);
    if (!res.ok) return;
    const data = await res.json();
    pearlRecList.set(deviceId, { fetchedAt: Date.now(), files: data.files || [] });
    renderPearlRecordings(deviceId);
  } catch (err) {
    console.warn('failed to load pearl recordings', err);
  }
}

function renderPearlRecordings(deviceId) {
  const host = document.getElementById(`pearl-recordings-${deviceId}`);
  if (!host) return;
  const cached = pearlRecList.get(deviceId);
  const files = cached?.files || [];
  if (files.length === 0) {
    host.innerHTML = `
      <div class="pearl-recordings-header">
        <span class="pearl-recordings-title">&#9655; Recent Recordings</span>
        <button class="pearl-rec-refresh" onclick="loadPearlRecordings('${deviceId}', true)">&#8635; Refresh</button>
      </div>
      <div class="pearl-recordings-empty">No recordings yet. Hit REC to start.</div>`;
    return;
  }
  // Group by timestamp — a single recording session produces one file per
  // recorder with identical created-time (within a second). Collapse them
  // so the UI shows one row per session with all 3 camera angles under it.
  const groups = new Map();
  for (const f of files) {
    const bucket = String(f.created).slice(0, 16); // minute granularity
    if (!groups.has(bucket)) groups.set(bucket, []);
    groups.get(bucket).push(f);
  }
  const sessions = [...groups.entries()].map(([when, items]) => ({
    when,
    items: items.sort((a, b) => a.recorderId - b.recorderId),
    totalMB: items.reduce((s, f) => s + f.sizeBytes, 0) / 1e6,
    duration: Math.max(...items.map((f) => f.duration)),
  }));
  host.innerHTML = `
    <div class="pearl-recordings-header">
      <span class="pearl-recordings-title">&#9655; Recent Recordings (${files.length} file${files.length === 1 ? '' : 's'} · ${sessions.length} session${sessions.length === 1 ? '' : 's'})</span>
      <button class="pearl-rec-refresh" onclick="loadPearlRecordings('${deviceId}', true)">&#8635; Refresh</button>
    </div>
    <div class="pearl-recordings-list">
      ${sessions.slice(0, 6).map((sess) => `
        <div class="pearl-session">
          <div class="pearl-session-head">
            <span class="pearl-session-when">${new Date(sess.when).toLocaleString([], { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
            <span class="pearl-session-meta">${formatHMS(sess.duration)} · ${sess.totalMB.toFixed(1)} MB</span>
          </div>
          <div class="pearl-session-files">
            ${sess.items.map((f) => `
              <button class="pearl-file-btn" onclick="playPearlFile('${deviceId}', ${f.recorderId}, '${encodeURIComponent(f.id)}', ${JSON.stringify(f.name).replace(/"/g,'&quot;')})">
                &#9658; ${recorderNameShort(f.name)}
              </button>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>`;
}

function recorderNameShort(name) {
  // "Center Camera_Apr20_16-08-45" → "Center"
  const base = String(name).split('_')[0];
  return base.replace(/\s*Camera\s*$/i, '').trim() || base;
}

// ── DAW recordings list ──────────────────────────────────
// Multitrack WAVs land in studio_<ts>/ subdirs of the sidecar's outputDir.
// Backend route /api/daw/:id/recordings reads that dir; here we cache, render
// a list grouped by session, and provide play/download per file.
const dawRecList = new Map(); // deviceId -> { fetchedAt, sessions, outputDir }

async function loadDawRecordings(deviceId, force) {
  const cached = dawRecList.get(deviceId);
  if (!force && cached && Date.now() - cached.fetchedAt < RECORDINGS_TTL_MS) {
    return renderDawRecordings(deviceId);
  }
  try {
    const res = await fetch(`${BACKEND_URL}/api/daw/${deviceId}/recordings`);
    if (!res.ok) return;
    const data = await res.json();
    dawRecList.set(deviceId, {
      fetchedAt: Date.now(),
      sessions: data.sessions || [],
      outputDir: data.outputDir || null,
    });
    renderDawRecordings(deviceId);
  } catch (err) {
    console.warn('failed to load DAW recordings', err);
  }
}

function renderDawRecordings(deviceId) {
  const host = document.getElementById(`daw-recordings-${deviceId}`);
  if (!host) return;

  if (sessions.length === 0) {

  host.innerHTML = `
    <div class="pearl-recordings-header">

      <button class="pearl-rec-refresh" onclick="loadDawRecordings('${deviceId}', true)">&#8635; Refresh</button>
    </div>
    <div class="pearl-recordings-list">
      ${sessions.slice(0, 6).map((sess) => `
        <div class="pearl-session">
          <div class="pearl-session-head">
            <span class="pearl-session-when">${new Date(sess.createdMs).toLocaleString([], { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
            <span class="pearl-session-meta">${formatHMS(sess.durationSec || 0)} · ${(sess.totalBytes / 1e6).toFixed(1)} MB · ${sess.files.length} track${sess.files.length === 1 ? '' : 's'}</span>
          </div>
          <div class="pearl-session-files">
            ${sess.files.map((f) => {
              const url = `${BACKEND_URL}/api/daw/${deviceId}/recordings/${encodeURIComponent(sess.name)}/${encodeURIComponent(f.name)}`;
              const display = f.name.replace(/\.wav$/i, '');

                <button class="pearl-file-btn" onclick="playDawFile('${deviceId}', ${JSON.stringify(sess.name).replace(/"/g, '&quot;')}, ${JSON.stringify(f.name).replace(/"/g, '&quot;')})">
                  &#9658; ${display}
                </button>
              `;
            }).join('')}

        </div>
      `).join('')}
    </div>`;
}

// Persistent <img> cache for MJPEG streams. The render() pipeline rewrites
// innerHTML, which would otherwise tear down the MJPEG <img> every time a
// device:update arrives — causing visible flicker every few seconds.
// We keep one <img> element per device id here and move it via appendChild
// (not clone) into whichever .cam-preview-slot is currently rendered. Moving
// a DOM node doesn't trigger a reload, so the MJPEG connection stays alive.
const camImgCache = new Map();

function attachPersistentCamImgs() {
  document.querySelectorAll('.cam-preview-slot').forEach((slot) => {
    const id = slot.dataset.deviceid;
    if (!id) return;
    let img = camImgCache.get(id);
    if (!img) {
      img = document.createElement('img');
      img.className = 'cam-preview';
      img.alt = 'Live preview';
      img.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block; background:#000;';
      // Slot can override the stream URL via data-stream-url (used by the
      // AV.io capture-card tile to point at /api/avio/<id>/mjpeg instead of
      // the Canon endpoint). Default keeps the Canon behavior so existing
      // camera cards continue to work unchanged.
      img.src = slot.dataset.streamUrl || `${BACKEND_URL}/api/canon/${id}/mjpeg`;
      img.onerror = () => {
        img.style.display = 'none';
        const ph = img.nextElementSibling;
        if (ph) ph.style.display = 'flex';
      };
      img.onload = () => {
        img.style.display = 'block';
        const ph = img.nextElementSibling;
        if (ph) ph.style.display = 'none';
      };
      camImgCache.set(id, img);
    }
    // Placeholder shown while the stream is connecting or failed.
    let ph = slot.querySelector('.camera-feed-placeholder');
    if (!ph) {
      ph = document.createElement('div');
      ph.className = 'camera-feed-placeholder';
      ph.style.display = 'none';
      ph.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="15" height="14" rx="2"/><polygon points="22,7 17,12 22,17"/></svg><span>Preview unavailable — camera may be in standby</span>';
    }
    if (img.parentElement !== slot) slot.appendChild(img);
    if (ph.parentElement !== slot) slot.appendChild(ph);
  });
  // Clean up cached imgs for rooms not currently rendered (frees Canon session slots).
  const visible = new Set([...document.querySelectorAll('.cam-preview-slot')].map((s) => s.dataset.deviceid));
  for (const [id, img] of camImgCache) {
    if (!visible.has(id)) {
      img.src = '';
      img.remove();
      camImgCache.delete(id);
    }
  }
}

let renderTimer = null;
let lastRenderedView = null; // `${view}|${roomId}` — track when the view actually changes
function render() {
  // Real 80ms debounce. Device updates arrive as separate socket events —
  // one per device — so without setTimeout debouncing we full-rewrite
  // mainContent 7x per 5s poll cycle and the page visibly blinks.
  if (renderTimer) return;
  renderTimer = setTimeout(() => {
    renderTimer = null;
    const viewKey = `${state.currentView}|${state.currentRoomId || ''}`;
    const viewChanged = viewKey !== lastRenderedView;
    lastRenderedView = viewKey;
    renderSidebar();
    renderBanner();
    if (state.currentView === 'room' && state.currentRoomId) {
      renderRoomDetail(state.currentRoomId, viewChanged);
    } else {
      renderDashboard();
    }
    attachPersistentCamImgs();
    attachPersistentAvioImgs();
    // Populate Pearl recording lists for any Pearl cards on screen.
    document.querySelectorAll('[id^="pearl-recordings-"]').forEach((el) => {
      const id = el.id.replace('pearl-recordings-', '');
      loadPearlRecordings(id, false);
    });
    // Populate DAW recording lists for any DAW cards on screen.
    document.querySelectorAll('[id^="daw-recordings-"]').forEach((el) => {
      const id = el.id.replace('daw-recordings-', '');
      loadDawRecordings(id, false);
    });
  }, 80);
}

function parseHash() {
  const hash = window.location.hash.replace('#', '');
  if (!hash) return;
  const parts = hash.split('/');
  const campusId = parts[0];
  const roomId = parts[1] || null;
  if (CONFIG.campuses.find(c => c.id === campusId)) {
    state.activeCampusId = campusId;
    if (roomId) {
      state.currentView = 'room';
      state.currentRoomId = roomId;
    } else {
      state.currentView = 'dashboard';
      state.currentRoomId = null;
    }
  }
}

// ══════════════════════════════════════════════
//  INIT
//
//  1. Fetch initial state via REST so the page paints
//     even if Socket.IO can't reach the server (e.g.
//     when WP iframes the dashboard but the WS proxy
//     isn't wired up yet).
//  2. Open the WebSocket and replace state on
//     `state:initial`, patch on `device:update`.
//  3. The refresh dot doubles as a connection indicator.
// ══════════════════════════════════════════════

function pickInitialCampus() {
  if (state.activeCampusId) return; // already set by hash
  const homeCampus = CONFIG.campuses.find(c => c.isHome);
  state.activeCampusId = homeCampus ? homeCampus.id : (CONFIG.campuses[0] && CONFIG.campuses[0].id) || null;
}

async function bootstrap() {
  // Initial REST snapshot
  try {
    const res = await fetch(`${BACKEND_URL}/api/rooms`);
    if (res.ok) {
      CONFIG = await res.json();
    } else {
      console.warn('GET /api/rooms failed', res.status);
    }
  } catch (err) {
    console.warn('GET /api/rooms error', err);
  }

  pickInitialCampus();
  parseHash();
  render();

  // Open the websocket. typeof check so we don't crash if
  // socket.io.js failed to load (e.g. cross-origin without proxy).
  if (typeof io === 'function') {
    const socket = io(BACKEND_URL || undefined, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => setConnState(true));
    socket.on('disconnect', () => setConnState(false));
    socket.on('connect_error', () => setConnState(false));

    socket.on('state:initial', (snapshot) => {
      CONFIG = snapshot;
      pickInitialCampus();
      render();
    });

    socket.on('device:update', ({ campusId, roomId, device }) => {
      const prev = findDeviceInConfig(campusId, roomId, device.id);
      // Detect a recording stop — the just-finished session needs to appear in
      // the Recent Recordings list without the user clicking Refresh. Force a
      // cache bypass so the new dir shows up immediately.
      if (device.type === 'daw' && prev?.recording?.active && !device.recording?.active) {
        loadDawRecordings(device.id, true);
      }
      if (patchDeviceInConfig(campusId, roomId, device)) {
        // Level-meter ticks arrive at 20 Hz. A full render() every time both
        // flickers the whole page and eats clicks on transient buttons (camera
        // PTZ, presets). Detect strips-only patches and update meter widths
        // in place instead.
        if (isDawLevelsOnlyPatch(prev, device)) {
          updateDawMeters(device);
          return;
        }
        if (state.currentView === 'dashboard' || state.currentRoomId === roomId) {
          render();
        }
      }
    });

    socket.on('device:error', ({ deviceId, error }) => {
      console.warn('device error', deviceId, error);
    });
  } else {
    console.warn('socket.io client not loaded; running in REST-only mode');
    setConnState(false);
  }

  window.addEventListener('hashchange', () => {
    parseHash();
    render();
  });

  attachPtzHold();
  attachDawOutputDirSave();

  // Live camera previews are now true MJPEG streams (multipart/x-mixed-replace),
  // so the browser handles per-frame updates — no JS polling needed.
}

// Studio Shutdown — park the whole room in one click. Gated behind a
// browser confirm() because the Pearl shutdown requires a physical power
// button press to reverse, so we don't want an accidental click during a
// live session.
function confirmStudioShutdown(roomId, roomName) {
  const msg =
    `Shut down ${roomName || roomId}?\n\n` +
    `This will:\n` +
    `  • Stop any active recording / stream\n` +
    `  • Put all cameras in standby\n` +
    `  • Power the Pearl OFF — it will need the physical power button\n` +
    `    on the front of the Pearl to come back online.\n\n` +
    `Continue?`;
  if (!confirm(msg)) return;
  cmd(`/api/studio/${roomId}/room-off`);
}

// Folder-picker modal. Opens from the "Browse…" button next to the DAW
// output-folder input. Lists directories from the host Mac via /api/fs/browse;
// user navigates and picks a folder, which gets written into the input.
async function openFolderPicker(startPath, onPick) {
  let currentPath = startPath || null;
  const backdrop = document.createElement('div');
  backdrop.className = 'fs-modal-backdrop';
  backdrop.innerHTML = `
    <div class="fs-modal" role="dialog" aria-label="Choose folder">
      <div class="fs-modal-header">
        <button class="ctrl-btn ctrl-btn-neutral" data-nav="up" title="Go up">↑</button>
        <button class="ctrl-btn ctrl-btn-neutral" data-nav="home" title="Home">⌂</button>
        <div class="fs-crumb"></div>
      </div>
      <div class="fs-modal-body"></div>
      <div class="fs-modal-footer">
        <button class="ctrl-btn ctrl-btn-neutral" data-action="cancel">Cancel</button>
        <button class="ctrl-btn ctrl-btn-green" data-action="select">Select this folder</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  const crumb = backdrop.querySelector('.fs-crumb');
  const body  = backdrop.querySelector('.fs-modal-body');
  const selectBtn = backdrop.querySelector('[data-action="select"]');
  const upBtn = backdrop.querySelector('[data-nav="up"]');

  async function load(path) {
    body.innerHTML = '<div class="fs-empty">Loading…</div>';
    const url = path ? `/api/fs/browse?path=${encodeURIComponent(path)}` : '/api/fs/browse';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const data = await res.json();
      currentPath = data.path;
      crumb.textContent = data.path;
      upBtn.disabled = !data.parent;
      selectBtn.disabled = !data.writable;
      selectBtn.title = data.writable ? '' : 'This folder is not writable';
      if (data.entries.length === 0) {
        body.innerHTML = '<div class="fs-empty">No subfolders</div>';
      } else {
        body.innerHTML = data.entries.map(e => `
          <div class="fs-entry ${e.writable ? '' : 'not-writable'}" data-path="${e.path.replace(/"/g,'&quot;')}">
            <span class="fs-icon">📁</span>
            <span>${e.name}</span>
            ${e.writable ? '' : '<span class="fs-lock">read-only</span>'}
          </div>
        `).join('');
      }
    } catch (err) {
      body.innerHTML = `<div class="fs-empty">Error: ${String(err.message || err)}</div>`;
    }
  }

  backdrop.addEventListener('click', async (ev) => {
    if (ev.target === backdrop) { close(); return; }
    const entry = ev.target.closest('.fs-entry');
    if (entry) { await load(entry.dataset.path); return; }
    const nav = ev.target.closest('[data-nav]');
    if (nav?.dataset.nav === 'up') {
      // Reload with parent. Easiest: fetch current, use its parent.
      const res = await fetch(`/api/fs/browse?path=${encodeURIComponent(currentPath)}`);
      const data = await res.json();
      if (data.parent) await load(data.parent);
      return;
    }
    if (nav?.dataset.nav === 'home') { await load(null); return; }
    const act = ev.target.closest('[data-action]');
    if (act?.dataset.action === 'cancel') { close(); return; }
    if (act?.dataset.action === 'select') {
      onPick(currentPath);
      close();
    }
  });
  function close() { backdrop.remove(); }
  await load(startPath);
}

// Save the DAW output folder — click button or press Enter in the input.
// Fires POST /api/daw/<id>/cmd with { op: 'output-dir', args: { path } }.
// Event delegation (not per-render listeners) keeps this resilient to the
// card being re-rendered between edits.
function attachDawOutputDirSave() {
  function save(input) {
    const id = input.dataset.dawId;
    const path = input.value.trim();
    if (!id || !path) return;
    cmd(`/api/daw/${id}/cmd`, { op: 'output-dir', args: { path } })
      .then(ok => { if (ok) showToast(`Output folder set to ${path}`, 'info'); });
  }
  document.addEventListener('click', (ev) => {
    const saveBtn = ev.target.closest('.daw-outdir-save');
    if (saveBtn) {
      const id = saveBtn.dataset.dawId;
      const input = document.querySelector(`.daw-outdir-input[data-daw-id="${CSS.escape(id)}"]`);
      if (input) save(input);
      return;
    }
    const browseBtn = ev.target.closest('.daw-outdir-browse');
    if (browseBtn) {
      const id = browseBtn.dataset.dawId;
      const input = document.querySelector(`.daw-outdir-input[data-daw-id="${CSS.escape(id)}"]`);
      if (!input) return;
      openFolderPicker(input.value.trim() || null, (picked) => {
        input.value = picked;
        save(input);
      });
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    const input = ev.target.closest('.daw-outdir-input');
    if (!input) return;
    ev.preventDefault();
    save(input);
  });
}

// Press-and-hold for PTZ / zoom buttons. Canon's control.cgi doesn't expose
// a velocity command through our backend — each POST nudges by PAN_STEP /
// TILT_STEP / ZOOM_STEP. Firing that endpoint on an interval while the
// button is held approximates continuous motion at ~7 steps/sec.
function attachPtzHold() {
  const HOLD_INTERVAL_MS = 130;
  let timer = null;
  let activeBtn = null;

  // Fire-and-forget — each nudge is idempotent and the camera serializes them
  // internally. An in-flight guard here would drop most ticks on slow cameras
  // (~250ms per POST), breaking the "continuous motion" feel.
  function fire(url, body) { cmd(url, body); }

  function endHold() {
    if (timer) { clearInterval(timer); timer = null; }
    if (activeBtn) { activeBtn.classList.remove('ptz-active'); activeBtn = null; }
  }

  document.addEventListener('pointerdown', (ev) => {
    const btn = ev.target.closest('[data-hold-url]');
    if (!btn || btn.disabled) return;
    ev.preventDefault();
    const url = btn.dataset.holdUrl;
    let body = null;
    try { body = btn.dataset.holdBody ? JSON.parse(btn.dataset.holdBody) : null; }
    catch (e) { console.warn('bad data-hold-body', btn.dataset.holdBody, e); return; }
    endHold();
    activeBtn = btn;
    btn.classList.add('ptz-active');
    // Setting pointer capture means pointerup fires on the button even if
    // the finger/cursor drifts off it mid-hold.
    try { btn.setPointerCapture(ev.pointerId); } catch {}
    fire(url, body);
    timer = setInterval(() => fire(url, body), HOLD_INTERVAL_MS);
  });

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
    document.addEventListener(evt, endHold);
  });
  // Stop if the tab is hidden — avoids an accidental runaway pan.
  document.addEventListener('visibilitychange', () => { if (document.hidden) endHold(); });
}

function showToast(msg, kind) {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:420px;';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `background:${kind === 'error' ? '#b91c1c' : '#1e3a8a'};color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;font-family:-apple-system,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:toastIn .15s ease-out;`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 4500);
}

// ── Auto-recovery admin panel ────────────────────────────
// Tiny floating widget in bottom-left. Click to expand. Shows status,
// last run, and a toggle button. Hidden behind a small icon when collapsed.
async function renderAutoRecoveryPanel() {
  let host = document.getElementById('auto-rec-panel');
  if (!host) {
    host = document.createElement('div');
    host.id = 'auto-rec-panel';
    host.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:9998;font-family:-apple-system,sans-serif;font-size:12px;';
    document.body.appendChild(host);
  }
  let status;
  try {
    status = await (await fetch(`${BACKEND_URL}/api/auto-recovery`)).json();
  } catch { status = { enabled: false, lastRunAt: null, smtpConfigured: false }; }

  const enabled = status.enabled;
  const lastRun = status.lastRunAt ? new Date(status.lastRunAt).toLocaleString() : 'never';
  const next = status.nextRunAt ? new Date(status.nextRunAt).toLocaleString() : '—';
  const dot = enabled ? '#22c55e' : '#9ca3af';
  const smtpBadge = status.smtpConfigured ? 'SMTP live' : 'log-only';
  host.innerHTML = `
    <details style="background:rgba(20,20,30,.92);color:#e5e7eb;border:1px solid #333;border-radius:8px;padding:6px 10px;backdrop-filter:blur(6px);">
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;">
        <span style="width:8px;height:8px;border-radius:50%;background:${dot};display:inline-block;"></span>
        Auto-recovery: <strong>${enabled ? 'ON' : 'OFF'}</strong> · ${smtpBadge}
      </summary>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;min-width:280px;">
        <div style="color:#9ca3af;">Last run: ${lastRun}</div>
        <div style="color:#9ca3af;">Next run: ${next}</div>
        ${status.lastRunSummary ? `
          <div style="color:#9ca3af;">Last sweep: ${status.lastRunSummary.devicesChecked} checked, ${status.lastRunSummary.rebootAttempts.filter(a => a.recovered).length} recovered, ${status.lastRunSummary.emailsSent} email${status.lastRunSummary.emailsSent === 1 ? '' : 's'}</div>
        ` : ''}
        <div style="display:flex;gap:6px;margin-top:4px;">
          <button onclick="toggleAutoRecovery()" style="flex:1;padding:6px;background:${enabled ? '#dc2626' : '#16a34a'};color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;">${enabled ? 'Turn OFF' : 'Turn ON'}</button>
          <button onclick="runAutoRecoveryNow()" style="flex:1;padding:6px;background:#374151;color:#fff;border:none;border-radius:4px;cursor:pointer;">Run now</button>
        </div>
      </div>
    </details>
  `;
}

async function toggleAutoRecovery() {
  const r = await fetch(`${BACKEND_URL}/api/auto-recovery/toggle`, { method: 'POST' });
  const data = await r.json();
  showToast(data.enabled ? '✓ Auto-recovery ON' : '✓ Auto-recovery OFF', 'info');
  renderAutoRecoveryPanel();
}

async function runAutoRecoveryNow() {
  if (!confirm('Run auto-recovery sweep right now? This will attempt soft-reboots on any offline cameras and Pearls. Email is in log-only mode unless SMTP is configured.')) return;
  showToast('Running auto-recovery sweep...', 'info');
  const r = await fetch(`${BACKEND_URL}/api/auto-recovery/run-now`, { method: 'POST' });
  const data = await r.json();
  showToast(`✓ Sweep done: ${data.devicesChecked} devices, ${data.rebootAttempts.filter(a=>a.recovered).length} recovered`, 'info');
  renderAutoRecoveryPanel();
}

renderAutoRecoveryPanel();
setInterval(renderAutoRecoveryPanel, 30000);

bootstrap();
</script>
