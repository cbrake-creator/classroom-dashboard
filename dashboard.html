<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Technology Health Dashboard</title>
<!-- Backend host injection point. Empty = same-origin (local dev or WP reverse proxy).
     A future host can pre-inject `window.BACKEND_URL = 'https://av-backend.dts.internal'`
     before this file loads to point at a remote backend without touching this code. -->
<script>window.BACKEND_URL = window.BACKEND_URL || '';</script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #222632;
    --bg-card-hover: #2a2f3d;
    --bg-sidebar: #161922;
    --text-primary: #e8eaf0;
    --text-secondary: #9ca3b4;
    --text-muted: #6b7280;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --green-border: rgba(34,197,94,0.3);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --red-border: rgba(239,68,68,0.3);
    --yellow: #eab308;
    --yellow-bg: rgba(234,179,8,0.12);
    --yellow-border: rgba(234,179,8,0.3);
    --gray: #6b7280;
    --gray-bg: rgba(107,114,128,0.12);
    --gray-border: rgba(107,114,128,0.3);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.12);
    --border: #2d3344;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }
  .topbar-logo span { color: var(--blue); }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .refresh-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .refresh-dot.disconnected {
    background: var(--red);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    min-height: calc(100vh - 49px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 16px;
    margin-bottom: 8px;
  }
  .campus-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .campus-item:hover { background: var(--bg-card); }
  .campus-item.active {
    background: var(--bg-card);
    border-left-color: var(--blue);
  }
  .campus-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .campus-name {
    font-size: 14px;
    font-weight: 500;
  }
  .campus-home-badge {
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-primary);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .campus-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .badge-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .badge-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }

  /* ── Alert Banner ── */
  .alert-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    background: var(--yellow-bg);
    border-bottom: 1px solid var(--yellow-border);
    font-size: 13px;
    color: var(--yellow);
  }
  .alert-banner.visible { display: flex; }
  .alert-banner-dismiss {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--yellow);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
  }

  /* ── Main Content ── */
  .main {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }

  /* ── Page Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-header h1 {
    font-size: 24px;
    font-weight: 700;
  }
  .page-header-stats {
    display: flex;
    gap: 16px;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* ── Section Headers ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    margin-top: 8px;
  }
  .section-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .section-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0 20px;
  }

  /* ── Room Cards Grid ── */
  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .room-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .room-card:hover {
    background: var(--bg-card-hover);
    border-color: #3d4355;
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .room-card-status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .room-card-status-bar.green { background: var(--green); }
  .room-card-status-bar.red { background: var(--red); }
  .room-card-status-bar.yellow { background: var(--yellow); }
  .room-card-status-bar.gray { background: var(--gray); }

  .room-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .room-card-name {
    font-size: 16px;
    font-weight: 600;
  }
  .room-card-status-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .status-icon-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .status-icon-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .status-icon-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .status-icon-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }

  .room-card-devices {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .room-device-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .room-card-issues {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--red);
  }

  /* ── Back Button ── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 16px;
  }
  .back-btn:hover { background: var(--bg-card); color: var(--text-primary); }

  /* ── Room Detail Header ── */
  .room-detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .room-detail-header h1 { font-size: 24px; font-weight: 700; }
  .room-detail-campus {
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
  }

  /* ── Device Cards Grid ── */
  .device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .device-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .device-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .device-card-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .device-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: var(--blue-bg);
    color: var(--blue);
  }
  .device-name {
    font-size: 15px;
    font-weight: 600;
  }
  .device-model {
    font-size: 11px;
    color: var(--text-muted);
  }
  .device-status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
  }
  .device-card-body { padding: 16px; }

  /* ── Camera Card ── */
  .camera-feed {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    position: relative;
    overflow: hidden;
  }
  .camera-feed-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .camera-feed-placeholder svg { opacity: 0.4; }
  .ptz-controls {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .ptz-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
  }
  .ptz-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }
  .ptz-center { grid-column: 2; grid-row: 2; }
  .zoom-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .zoom-btn {
    width: 44px; height: 36px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .zoom-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }

  /* ── Camera Session / API Bar ── */
  .cam-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    margin-bottom: 14px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .cam-session-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
  }
  .cam-session-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .cam-api-info {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin-bottom: 14px;
    border: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cam-api-info code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    color: var(--blue);
  }
  .cam-pos-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cam-pos-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cam-pos-value {
    color: var(--text-primary);
    font-weight: 600;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .cam-livescope-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    margin-bottom: 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .cam-livescope-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .cam-livescope-warn { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .cam-livescope-err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .cam-transition-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--yellow);
    font-size: 13px;
    font-weight: 500;
  }
  .cam-transition-spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cam-snapshot-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    z-index: 2;
  }
  .cam-snapshot-btn:hover { background: rgba(0,0,0,0.8); border-color: var(--blue); }

  /* ── Control Buttons ── */
  .control-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .ctrl-btn-green:hover { background: rgba(34,197,94,0.2); }
  .ctrl-btn-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .ctrl-btn-red:hover { background: rgba(239,68,68,0.2); }
  .ctrl-btn-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .ctrl-btn-blue:hover { background: rgba(59,130,246,0.2); }
  .ctrl-btn-neutral { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border); }
  .ctrl-btn-neutral:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .ctrl-btn-active { background: var(--green); color: #000; border-color: var(--green); }

  /* ── Metrics ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .metric-item {
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .metric-value {
    font-size: 18px;
    font-weight: 700;
  }
  .metric-value.ok { color: var(--green); }
  .metric-value.warn { color: var(--yellow); }
  .metric-value.error { color: var(--red); }

  /* ── TV Input Selector ── */
  .input-display {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
  }
  .input-display.correct { background: var(--green-bg); border: 1px solid var(--green-border); }
  .input-display.incorrect { background: var(--red-bg); border: 1px solid var(--red-border); }
  .input-label { font-size: 12px; color: var(--text-muted); }
  .input-value { font-size: 15px; font-weight: 600; }
  .input-value.correct { color: var(--green); }
  .input-value.incorrect { color: var(--red); }
  .input-expected { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .input-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .input-btn {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .input-btn:hover { border-color: var(--blue); color: var(--text-primary); }
  .input-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ── Switch Port Grid ── */
  .port-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 6px;
    margin-bottom: 14px;
  }
  .port-item {
    text-align: center;
    padding: 8px 4px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    font-size: 12px;
    font-weight: 600;
  }
  .port-item .port-num { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }

  /* ── SVG Icons ── */
  .icon { display: inline-block; vertical-align: middle; }

  /* ── Studio (Faculty Podcast) ── */
  .studio-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    margin-bottom: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .studio-session-bar.live {
    background: rgba(239,68,68,0.08);
    border-color: var(--red-border);
  }
  .studio-session-bar-left { display: flex; align-items: center; gap: 14px; }
  .studio-live-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--gray);
  }
  .studio-session-bar.live .studio-live-dot {
    background: var(--red);
    animation: pulse 1.5s infinite;
  }
  .studio-session-title { font-size: 16px; font-weight: 700; }
  .studio-session-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .studio-session-actions { display: flex; gap: 8px; }

  /* Pearl card */
  .pearl-state-row {
    display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .pearl-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
    background: var(--bg-primary); border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .pearl-pill.rec { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
  .pearl-pill.rec .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); animation: pulse 1.5s infinite;
  }
  .pearl-pill.stream { background: var(--blue-bg); color: var(--blue); border-color: rgba(59,130,246,0.3); }
  .pearl-pill.idle { background: var(--gray-bg); color: var(--text-muted); border-color: var(--gray-border); }

  .pearl-source-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pearl-source-dot.up { background: var(--green); }
  .pearl-source-dot.down { background: var(--gray); }
  .pearl-source-text { display: flex; flex-direction: column; min-width: 0; }
  .pearl-source-name { font-weight: 600; color: var(--text-primary); font-size: 11px; }
  .pearl-source-label { color: var(--text-muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Mac card */
  .mac-apps-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .mac-app-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: var(--bg-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 12px;
  }
  .mac-app-left { display: flex; align-items: center; gap: 8px; }
  .mac-app-dot { width: 8px; height: 8px; border-radius: 50%; }
  .mac-app-dot.up { background: var(--green); }
  .mac-app-dot.down { background: var(--red); }
  .mac-app-pid { color: var(--text-muted); font-family: 'SF Mono', monospace; font-size: 10px; }
  .mac-app-restart {
    background: transparent; border: 1px solid var(--border);

  .mac-audio-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px; background: var(--bg-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    margin-bottom: 12px; font-size: 12px;
  }
  .mac-audio-line { display: flex; justify-content: space-between; }
  .mac-audio-line .label { color: var(--text-muted); }
  .mac-audio-line .value { color: var(--text-primary); font-weight: 600; }

  /* Rodecaster card */
  .rcp-conn-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 12px; margin-bottom: 12px;
  }
  .rcp-strip-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .rcp-strip {
    display: grid;
    grid-template-columns: 110px 1fr 24px;
    gap: 10px; align-items: center;
    padding: 6px 10px; background: var(--bg-primary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 11px;
  }
  .rcp-strip.muted .rcp-strip-name { color: var(--text-muted); text-decoration: line-through; }
  .rcp-strip-name { font-weight: 600; color: var(--text-primary); }
  .rcp-meter {
    height: 6px; background: var(--bg-card);
    border-radius: 3px; overflow: hidden; position: relative;
  }
  .rcp-meter-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--green) 0%, var(--green) 60%, var(--yellow) 80%, var(--red) 100%);
  }
  .rcp-strip-icon { color: var(--text-muted); text-align: right; font-size: 12px; }

  /* Limitations / dev note footer */
  .device-note {
    font-size: 11px;
    color: var(--yellow);
    background: var(--yellow-bg);
    border: 1px solid var(--yellow-border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin-top: 4px;
    line-height: 1.4;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .sidebar { width: 60px; }
    .campus-name, .campus-home-badge, .sidebar-title { display: none; }
    .campus-item { justify-content: center; padding: 10px 8px; }
    .campus-item-left { gap: 0; }
    .main { padding: 16px; }
    .room-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .device-grid { grid-template-columns: 1fr; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>

<!-- ── Top Bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo"><span>&#9671;</span> AV Health Dashboard</div>
  </div>
  <div class="topbar-right">
    <div class="refresh-indicator">
      <div class="refresh-dot" id="refreshDot"></div>
      <span id="lastRefresh">Connecting…</span>
    </div>
    <span id="connState">Live</span>
  </div>
</div>

<!-- ── Alert Banner ── -->
<div class="alert-banner" id="alertBanner">
  <span>&#9888;</span>
  <span id="alertBannerText"></span>
  <button class="alert-banner-dismiss" onclick="dismissBanner()">&times;</button>
</div>

<!-- ── Layout ── -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Campuses</div>
    <div id="campusList"></div>
  </aside>

  <!-- Main Content -->
  <div class="main" id="mainContent"></div>

</div>

<script>
// ══════════════════════════════════════════════
//  BACKEND WIRING
//
//  CONFIG used to be a static literal in this file.
//  It is now hydrated from the backend's GET /api/rooms
//  on first paint, then continuously patched by
//  Socket.IO `device:update` events.
//
//  All device commands go through cmd(path, body) → POST.
//  No business logic in the browser.
// ══════════════════════════════════════════════

const BACKEND_URL = window.BACKEND_URL || '';

// CONFIG starts empty so render() can run before /api/rooms returns.
let CONFIG = { campuses: [] };

async function cmd(path, body) {
  try {
    const res = await fetch(`${BACKEND_URL}${path}`, {
      method: 'POST',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      console.warn('cmd failed', path, res.status, text);
    }
    return res.ok;
  } catch (err) {
    console.warn('cmd error', path, err);
    return false;
  }
}

// Patch a device in CONFIG by id (campusId + roomId scope guards against id collisions
// between rooms — e.g. cam-1 in multiple rooms).
function patchDeviceInConfig(campusId, roomId, device) {
  const campus = CONFIG.campuses.find(c => c.id === campusId);
  if (!campus) return false;
  const room = campus.rooms.find(r => r.id === roomId);
  if (!room) return false;
  const idx = room.devices.findIndex(d => d.id === device.id);
  if (idx < 0) return false;
  room.devices[idx] = device;
  return true;
}

function setConnState(connected) {
  const dot = document.getElementById('refreshDot');
  const label = document.getElementById('lastRefresh');
  const conn = document.getElementById('connState');
  if (!dot || !label || !conn) return;
  if (connected) {
    dot.classList.remove('disconnected');
    label.textContent = 'Live';
    conn.textContent = 'WebSocket';
  } else {
    dot.classList.add('disconnected');
    label.textContent = 'Disconnected';
    conn.textContent = 'Reconnecting…';
  }
}


// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════

let state = {
  activeCampusId: null,
  currentView: 'dashboard', // 'dashboard' | 'room'
  currentRoomId: null,
  dismissedBanner: false
};

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════

function getDeviceIssues(device) {
  const issues = [];
  if (device.status === 'offline') issues.push('Device offline');
  if (device.status === 'unknown') issues.push('Status unknown (no live poll yet)');
  if (device.type === 'display' && device.power === false) issues.push('Powered off');
  if (device.type === 'display' && device.currentInput !== device.correctInput) issues.push(`Wrong input (${device.currentInput}, expected ${device.correctInput})`);
  if (device.type === 'camera' && device.power === false) issues.push('Camera off');
  if (device.type === 'nuc' && device.power === false) issues.push('NUC off');
  if (device.type === 'nuc' && device.cpu > 80) issues.push('High CPU');
  if (device.type === 'rally-bar' && device.power === false) issues.push('Rally Bar off');
  if (device.type === 'tap' && device.power === false) issues.push('Tap off');
  if (device.type === 'sight' && device.power === false) issues.push('Sight off');
  if (device.type === 'audio' && device.power === false) issues.push('Audio off');
  if (device.type === 'network-switch' && device.ports) {
    const downPorts = device.ports.filter(p => !p.up);
    if (downPorts.length > 0) issues.push(`${downPorts.length} port(s) down`);
  }
  if (device.type === 'pearl') {
    if (device.cpu > 80) issues.push('Pearl CPU high');
    if (device.temp && device.temp > 75) issues.push('Pearl temperature high');
    if (device.storage && (device.storage.freeGb / device.storage.totalGb) < 0.10) issues.push('Pearl storage <10%');
    (device.sources || []).forEach(s => {
      if (!s.connected && s.label && s.label !== '—') issues.push(`Pearl source ${s.name} disconnected`);
    });
  }
  if (device.type === 'mac') {
    if (device.cpu > 80) issues.push('Mac CPU high');
    if (device.mem > 85) issues.push('Mac memory high');
    if (device.disk && (device.disk.freeGb / device.disk.totalGb) < 0.10) issues.push('Mac disk <10%');
  }
  if (device.type === 'rodecaster' && device.status === 'offline') issues.push('Rodecaster not detected on Mac USB');
  if (device.type === 'daw' && !device.sidecarConnected) issues.push('DAW sidecar not connected');
  return issues;
}

function getRoomHealth(room) {
  let totalIssues = 0;
  room.devices.forEach(d => { totalIssues += getDeviceIssues(d).length; });
  if (totalIssues === 0) return 'green';
  if (totalIssues <= 2) return 'yellow';
  return 'red';
}

function getRoomIssueCount(room) {
  let count = 0;
  room.devices.forEach(d => { count += getDeviceIssues(d).length; });
  return count;
}

function getCampusIssueCount(campus) {
  let count = 0;
  campus.rooms.forEach(r => { count += getRoomIssueCount(r); });
  return count;
}

function getDeviceStatusColor(device) {
  return getDeviceIssues(device).length > 0 ? 'red' : 'green';
}

function deviceIcon(type) {
  const icons = {
    camera: '&#9673;',          // camera
    nuc: '&#9634;',             // computer
    'network-switch': '&#8644;', // switch
    display: '&#9632;',         // screen
    'rally-bar': '&#9654;',     // video bar
    tap: '&#9641;',             // touch controller
    sight: '&#9673;',           // AI camera
    audio: '&#9835;',           // audio
    pearl: '&#9210;',           // encoder/recorder
    mac: '&#63743;',            // mac (Apple logo PUA — falls back gracefully)
    rodecaster: '&#9836;',      // mixer
    daw: '&#9835;'              // DAW / console
  };
  return icons[type] || '&#9679;';
}

function deviceTypeName(type) {
  const names = {
    camera: 'Camera', nuc: 'Computer', 'network-switch': 'Switch', display: 'Display',
    'rally-bar': 'Rally Bar', tap: 'Tap Controller', sight: 'Sight Camera', audio: 'Audio',
    pearl: 'Encoder', mac: 'Mac Studio', rodecaster: 'Mixer', daw: 'Studio DAW'
  };
  return names[type] || type;
}

// ══════════════════════════════════════════════
//  RENDER: SIDEBAR
// ══════════════════════════════════════════════

function renderSidebar() {
  const el = document.getElementById('campusList');
  el.innerHTML = CONFIG.campuses.map(c => {
    const issues = getCampusIssueCount(c);
    const active = c.id === state.activeCampusId;
    const badgeClass = issues === 0 ? 'badge-green' : issues <= 3 ? 'badge-yellow' : 'badge-red';
    const badgeText = issues === 0 ? '&#10003;' : `${issues}`;
    return `
      <div class="campus-item ${active ? 'active' : ''}" onclick="switchCampus('${c.id}')">
        <div class="campus-item-left">
          <span class="campus-name">${c.name}</span>
          ${c.isHome ? '<span class="campus-home-badge">HOME</span>' : ''}
        </div>
        <span class="campus-badge ${badgeClass}">${badgeText}</span>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════════════════════
//  RENDER: ALERT BANNER
// ══════════════════════════════════════════════

function renderBanner() {
  if (state.dismissedBanner) return;
  const banner = document.getElementById('alertBanner');
  const homeCampus = CONFIG.campuses.find(c => c.isHome);
  const otherIssues = CONFIG.campuses
    .filter(c => !c.isHome)
    .filter(c => getCampusIssueCount(c) > 0);

  if (otherIssues.length > 0) {
    const text = otherIssues.map(c => `${c.name}: ${getCampusIssueCount(c)} issue(s)`).join(' &middot; ');
    document.getElementById('alertBannerText').innerHTML = text;
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
}

function dismissBanner() {
  state.dismissedBanner = true;
  document.getElementById('alertBanner').classList.remove('visible');
}

// ══════════════════════════════════════════════
//  RENDER: DASHBOARD (Level 1)
// ══════════════════════════════════════════════

function renderDashboard() {
  const campus = CONFIG.campuses.find(c => c.id === state.activeCampusId);
  if (!campus) return;

  const classrooms = campus.rooms.filter(r => r.type === 'classroom');
  const conferences = campus.rooms.filter(r => r.type === 'conference');
  const studios = campus.rooms.filter(r => r.type === 'studio');

  const totalIssues = getCampusIssueCount(campus);
  const healthyRooms = campus.rooms.filter(r => getRoomIssueCount(r) === 0).length;

  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="page-header">
      <h1>${campus.name} Campus</h1>
      <div class="page-header-stats">
        <div class="stat-chip">
          <div class="stat-dot" style="background: var(--green)"></div>
          ${healthyRooms} Healthy
        </div>
        <div class="stat-chip">
          <div class="stat-dot" style="background: ${totalIssues > 0 ? 'var(--red)' : 'var(--green)'}"></div>
          ${totalIssues} Issue${totalIssues !== 1 ? 's' : ''}
        </div>
        <div class="stat-chip">
          ${campus.rooms.length} Rooms
        </div>
      </div>
    </div>

    <div class="section-header">
      <h2>Classrooms</h2>
      <span class="section-count">${classrooms.length}</span>
    </div>
    <div class="room-grid">
      ${classrooms.map(r => renderRoomCard(r)).join('')}
    </div>

    ${conferences.length > 0 ? `
      <hr class="section-divider">
      <div class="section-header">
        <h2>Conference Rooms</h2>
        <span class="section-count">${conferences.length}</span>
      </div>
      <div class="room-grid">
        ${conferences.map(r => renderRoomCard(r)).join('')}
      </div>
    ` : ''}

    ${studios.length > 0 ? `
      <hr class="section-divider">
      <div class="section-header">
        <h2>Studios</h2>
        <span class="section-count">${studios.length}</span>
      </div>
      <div class="room-grid">
        ${studios.map(r => renderRoomCard(r)).join('')}
      </div>
    ` : ''}
  `;
}

function renderRoomCard(room) {
  const health = getRoomHealth(room);
  const issues = getRoomIssueCount(room);
  const statusIcons = { green: '&#10003;', yellow: '&#9888;', red: '&#10007;' };

  return `
    <div class="room-card" onclick="openRoom('${room.id}')">
      <div class="room-card-status-bar ${health}"></div>
      <div class="room-card-top">
        <span class="room-card-name">${room.name}</span>
        <div class="room-card-status-icon status-icon-${health}">
          ${statusIcons[health]}
        </div>
      </div>
      <div class="room-card-devices">
        ${room.devices.map(d => {
          const color = getDeviceStatusColor(d) === 'green' ? 'var(--green)' : 'var(--red)';
          return `<div class="room-device-pip" style="background:${color}" title="${deviceTypeName(d.type)}: ${d.brand}"></div>`;
        }).join('')}
      </div>
      ${issues > 0 ? `<div class="room-card-issues">${issues} issue${issues !== 1 ? 's' : ''}</div>` : ''}
    </div>
  `;
}

// ══════════════════════════════════════════════
//  RENDER: ROOM DETAIL (Level 2)
// ══════════════════════════════════════════════

function renderRoomDetail(roomId) {
  const campus = CONFIG.campuses.find(c => c.id === state.activeCampusId);
  const room = campus.rooms.find(r => r.id === roomId);
  if (!room) return;

  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <button class="back-btn" onclick="goBack()">&#8592; Back to ${campus.name}</button>
    <div class="room-detail-header">
      <h1>${room.name}</h1>
      <span class="room-detail-campus">${campus.name}</span>
      <span class="campus-badge badge-${getRoomHealth(room)}" style="font-size:12px;">
        ${getRoomIssueCount(room) === 0 ? 'All Clear' : getRoomIssueCount(room) + ' issue(s)'}
      </span>
    </div>
    ${room.type === 'studio' ? renderStudioSessionBar(room) : ''}
    <div class="device-grid">
      ${room.devices.map(d => renderDeviceCard(d)).join('')}
    </div>
  `;
}

function getStudioSession(room) {
  const pearl = room.devices.find(d => d.type === 'pearl');
  if (!pearl) return { live: false, label: 'No Encoder', sub: 'No Pearl device in this room' };
  const recording = (pearl.recorders || []).some(r => r.state === 'recording');
  const streaming = (pearl.publishers || []).some(p => p.state === 'streaming');
  if (recording && streaming) return { live: true, label: 'LIVE — Recording + Streaming', sub: 'Pearl encoder is recording to disk and pushing RTMP' };
  if (recording) return { live: true, label: 'RECORDING', sub: 'Pearl recorder is active' };
  if (streaming) return { live: true, label: 'STREAMING', sub: 'Pearl publisher is active' };
  return { live: false, label: 'Idle', sub: 'No active recording or stream' };
}

function renderStudioSessionBar(room) {
  const sess = getStudioSession(room);
  const liveCls = sess.live ? 'live' : '';
  const sessionPath = sess.live ? 'stop-session' : 'start-session';
  return `
    <div class="studio-session-bar ${liveCls}">
      <div class="studio-session-bar-left">
        <div class="studio-live-dot"></div>
        <div>
          <div class="studio-session-title">${sess.label}</div>
          <div class="studio-session-sub">${sess.sub}</div>
        </div>
      </div>
      <div class="studio-session-actions">
        <button class="ctrl-btn ctrl-btn-${sess.live ? 'red' : 'green'}" onclick="cmd('/api/studio/${room.id}/${sessionPath}')" title="POST /api/studio/${room.id}/${sessionPath}">
          ${sess.live ? '&#9632; Stop Session' : '&#9679; Start Session'}
        </button>
        <button class="ctrl-btn ctrl-btn-neutral" onclick="cmd('/api/studio/${room.id}/prep')" title="POST /api/studio/${room.id}/prep">
          &#9881; Prep Studio
        </button>
      </div>
    </div>
  `;
}

function renderDeviceCard(device) {
  const issues = getDeviceIssues(device);
  const statusColor = issues.length > 0 ? 'red' : 'green';
  const statusText = issues.length > 0 ? issues[0] : 'Online';
  const badgeClass = statusColor === 'green' ? 'badge-green' : 'badge-red';

  let body = '';

  if (device.type === 'camera') {
    body = renderCameraBody(device);
  } else if (device.type === 'nuc') {
    body = renderNucBody(device);
  } else if (device.type === 'network-switch') {
    body = renderSwitchBody(device);
  } else if (device.type === 'display') {
    body = renderDisplayBody(device);
  } else if (device.type === 'rally-bar' || device.type === 'tap' || device.type === 'sight' || device.type === 'audio') {
    body = renderSimpleDeviceBody(device);
  } else if (device.type === 'pearl') {
    body = renderPearlBody(device);
  } else if (device.type === 'mac') {
    body = renderMacBody(device);
  } else if (device.type === 'rodecaster') {
    body = renderRodecasterBody(device);
  } else if (device.type === 'daw') {
    body = renderDawBody(device);
  }

  return `
    <div class="device-card">
      <div class="device-card-header">
        <div class="device-card-header-left">
          <div class="device-icon">${deviceIcon(device.type)}</div>
          <div>
            <div class="device-name">${device.label ? device.label + ' — ' : deviceTypeName(device.type) + ' — '}${device.brand}</div>
            <div class="device-model">${device.model || ''} &middot; ${device.ip}</div>
          </div>
        </div>
        <span class="device-status-badge ${badgeClass}">${statusText}</span>
      </div>
      <div class="device-card-body">
        ${body}
      </div>
    </div>
  `;
}

function renderCameraBody(device) {
  const isOnline = device.status === 'online';
  const isTransitioning = device.powerTransition != null;

  // Livescope status display
  const lsCode = device.livescopeStatus || 0;
  let lsClass = 'cam-livescope-ok';
  let lsText = `Livescope: ${lsCode} OK`;
  if (!isOnline) { lsClass = 'cam-livescope-err'; lsText = 'Livescope: Unreachable'; }
  else if (lsCode === 301) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 301 — In use by another client'; }
  else if (lsCode === 503) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 503 — Too many clients'; }
  else if (lsCode === 509) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 509 — Standby'; }
  else if (lsCode === 510) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 510 — Entering standby...'; }
  else if (lsCode === 511) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 511 — Waking up...'; }
  else if (lsCode === 507) { lsClass = 'cam-livescope-err'; lsText = 'Livescope: 507 — Auth failed'; }

  // Power state text
  let powerLabel = device.power ? 'Standby' : 'Wake';
  let powerBtnClass = device.power ? 'ctrl-btn-red' : 'ctrl-btn-green';
  if (device.powerTransition === 'standby-pending') { powerLabel = 'Entering Standby...'; powerBtnClass = 'ctrl-btn-neutral'; }
  else if (device.powerTransition === 'waking') { powerLabel = 'Waking Up...'; powerBtnClass = 'ctrl-btn-neutral'; }

  return `
    <div class="camera-feed">
      ${isOnline ? `<button class="cam-snapshot-btn" onclick="window.open(BACKEND_URL + '/api/canon/${device.id}/snapshot', '_blank')" title="GET /api/canon/${device.id}/snapshot">&#128247; Snapshot</button>` : ''}
      ${isTransitioning ? `
        <div class="cam-transition-overlay">
          <div class="cam-transition-spinner"></div>
          <span>${device.powerTransition === 'waking' ? 'Camera starting up...' : 'Camera shutting down...'}</span>
        </div>
      ` : ''}
      <div class="camera-feed-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="5" width="15" height="14" rx="2"/>
          <polygon points="22,7 17,12 22,17"/>
        </svg>
        <span>${!isOnline ? 'Camera Offline' : 'MJPEG Stream — video.cgi?w=1'}</span>
      </div>
    </div>

    <!-- Livescope Status -->
    <div class="cam-livescope-bar ${lsClass}">
      <span>${lsText}</span>
    </div>

    <!-- Session & Control (XC Protocol) -->
    <div class="cam-session-bar">
      <div class="cam-session-bar-left">
        <div class="cam-session-dot" style="background: ${isOnline ? 'var(--green)' : 'var(--red)'}"></div>
        <span>${isOnline ? 'XC Protocol' : 'Unreachable'}</span>
        <span style="color:var(--text-muted); font-size:11px;">${device.auth && device.auth.enabled ? '&#128274; Auth' : '&#128275; Open'}</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="ctrl-btn ctrl-btn-blue" style="padding:4px 10px; font-size:11px;" onclick="cmd('/api/canon/${device.id}/claim')" title="POST /api/canon/${device.id}/claim">
          ${device.controlClaimed ? '&#9679; Control Claimed' : '&#9675; Claim Control'}
        </button>
        <button class="ctrl-btn ctrl-btn-neutral" style="padding:4px 10px; font-size:11px;" onclick="cmd('/api/canon/${device.id}/release')" title="POST /api/canon/${device.id}/release">
          Release
        </button>
      </div>
    </div>

    <!-- PTZ Position Readout (from info.cgi) -->
    <div class="cam-pos-bar">
      <div class="cam-pos-item">Pan <span class="cam-pos-value">${isOnline ? device.panPos + '&deg;' : '—'}</span></div>
      <div class="cam-pos-item">Tilt <span class="cam-pos-value">${isOnline ? device.tiltPos + '&deg;' : '—'}</span></div>
      <div class="cam-pos-item">Zoom <span class="cam-pos-value">${isOnline ? device.zoomPos + '%' : '—'}</span></div>
    </div>

    <!-- PTZ Controls (control.cgi) -->
    <div class="ptz-controls">
      <div></div>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'tilt-up' })" title="Tilt Up">&#9650;</button>
      <div></div>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'pan-left' })" title="Pan Left">&#9664;</button>
      <button class="ptz-btn ptz-center" onclick="cmd('/api/canon/${device.id}/home')" title="Home Preset">&#8962;</button>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'pan-right' })" title="Pan Right">&#9654;</button>
      <div></div>
      <button class="ptz-btn" onclick="cmd('/api/canon/${device.id}/ptz', { action: 'tilt-down' })" title="Tilt Down">&#9660;</button>
      <div></div>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="cmd('/api/canon/${device.id}/zoom', { direction: 'out' })" title="Zoom Out">&minus;</button>
      <button class="zoom-btn" onclick="cmd('/api/canon/${device.id}/zoom', { direction: 'in' })" title="Zoom In">&plus;</button>
    </div>

    <!-- Camera Actions -->
    <div class="control-row">
      <button class="ctrl-btn ${device.autoTrack ? 'ctrl-btn-active' : 'ctrl-btn-green'}" onclick="cmd('/api/canon/${device.id}/autotrack', { enabled: ${!device.autoTrack} })" title="POST /api/canon/${device.id}/autotrack">
        &#9678; Auto-Track ${device.autoTrack ? 'ON' : 'OFF'}
      </button>
      <button class="ctrl-btn ${powerBtnClass}" onclick="cmd('/api/canon/${device.id}/standby', { on: ${!!device.power} })" title="POST /api/canon/${device.id}/standby">
        &#9211; ${powerLabel}
      </button>
    </div>

    <!-- API Reference -->
    <div class="cam-api-info">
      <span>XC Protocol v011 &middot; Canon ${device.model}</span>
      <span>Status: <code>info.cgi</code> &middot; PTZ: <code>control.cgi</code> &middot; Stream: <code>video.cgi?w=1</code></span>
      <span>Power: <code>standby.cgi</code> &middot; Snap: <code>image.cgi?w=1</code></span>
      <span>Session: <code>open → claim → yield → close</code></span>
    </div>
  `;
}

function renderPearlBody(device) {
  const isOnline = device.status === 'online';
  const recording = (device.recorders || []).some(r => r.state === 'recording');
  const streaming = (device.publishers || []).some(p => p.state === 'streaming');
  const storagePctFree = device.storage ? Math.round((device.storage.freeGb / device.storage.totalGb) * 100) : 0;
  const cpuClass = device.cpu > 80 ? 'error' : device.cpu > 60 ? 'warn' : 'ok';
  const tempClass = device.temp > 75 ? 'error' : device.temp > 65 ? 'warn' : 'ok';
  const storageClass = storagePctFree < 10 ? 'error' : storagePctFree < 25 ? 'warn' : 'ok';

  return `
    <!-- Encoder state pills -->
    <div class="pearl-state-row">
      ${recording
        ? '<span class="pearl-pill rec"><span class="dot"></span>REC</span>'
        : '<span class="pearl-pill idle">REC OFF</span>'}
      ${streaming
        ? '<span class="pearl-pill stream">&#9673; STREAMING</span>'
        : '<span class="pearl-pill idle">STREAM OFF</span>'}
      <span class="pearl-pill">FW ${device.firmware || '—'}</span>
      <span class="pearl-pill">UP ${device.uptime || '—'}</span>
    </div>

    <!-- Channels (encoders) -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Channels</div>
    <div class="pearl-channel-list">
      ${(device.channels || []).map(ch => `
        <div class="pearl-channel">
          <div>
            <div class="pearl-channel-name">${ch.name}</div>
            <div class="pearl-channel-meta">Layout: ${ch.currentLayout}</div>
          </div>
          <div class="pearl-channel-meta">${ch.fps}fps &middot; ${(ch.bitrateKbps/1000).toFixed(1)}Mbps</div>
        </div>
      `).join('')}
    </div>

    <!-- Sources -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Inputs</div>
    <div class="pearl-source-grid">
      ${(device.sources || []).map(s => `
        <div class="pearl-source-item">
          <div class="pearl-source-dot ${s.connected ? 'up' : 'down'}"></div>
          <div class="pearl-source-text">
            <span class="pearl-source-name">${s.name}</span>
            <span class="pearl-source-label">${s.label}</span>
          </div>
        </div>
      `).join('')}
    </div>

    <!-- System metrics -->
    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-label">CPU</div>
        <div class="metric-value ${cpuClass}">${isOnline ? device.cpu + '%' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Temperature</div>
        <div class="metric-value ${tempClass}">${isOnline ? device.temp + '&deg;C' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Storage Free</div>
        <div class="metric-value ${storageClass}">${isOnline && device.storage ? storagePctFree + '%' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Storage</div>
        <div class="metric-value ok" style="font-size:13px;">${device.storage ? device.storage.freeGb + ' / ' + device.storage.totalGb + ' GB' : '—'}</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="control-row">
      ${(device.recorders || []).map(r => `
        <button class="ctrl-btn ${r.state === 'recording' ? 'ctrl-btn-red' : 'ctrl-btn-green'}"
                onclick="cmd('/api/pearl/${device.id}/recorder/${r.id}/${r.state === 'recording' ? 'stop' : 'start'}')"
                title="POST /api/pearl/${device.id}/recorder/${r.id}/${r.state === 'recording' ? 'stop' : 'start'}">
          ${r.state === 'recording' ? '&#9632; Stop' : '&#9679; Rec'} ${r.name}
        </button>
      `).join('')}
      ${(device.publishers || []).map(p => `
        <button class="ctrl-btn ${p.state === 'streaming' ? 'ctrl-btn-red' : 'ctrl-btn-blue'}"
                onclick="cmd('/api/pearl/${device.id}/channel/${p.channelId}/publisher/${p.id}/${p.state === 'streaming' ? 'stop' : 'start'}')"
                title="POST /api/pearl/${device.id}/channel/${p.channelId}/publisher/${p.id}/${p.state === 'streaming' ? 'stop' : 'start'}">
          ${p.state === 'streaming' ? '&#9632; Stop' : '&#9673;'} ${p.destination}
        </button>
      `).join('')}
    </div>

    <!-- API reference -->
    <div class="cam-api-info">
      <span>Epiphan Pearl REST API v2.0 &middot; ${device.model}</span>
      <span>Status: <code>/system/status</code> &middot; Storage: <code>/system/storage</code></span>
      <span>Encoders: <code>/channels</code> &middot; Recorders: <code>/recorders</code> &middot; Publishers: <code>/channels/{id}/publishers</code></span>
      <span>Inputs: <code>/sources</code> &middot; Layouts: <code>/channels/{id}/layouts</code></span>
    </div>
  `;
}

      <button class="ctrl-btn ctrl-btn-red" onclick="if (confirm('Reboot Mac Studio?')) cmd('/api/mac/${device.id}/reboot')" title="POST /api/mac/${device.id}/reboot">&#8635; Reboot</button>
    </div>

    <!-- API reference -->
    <div class="cam-api-info">

      <span>Audio: <code>SwitchAudioSource</code> &middot; <code>osascript volume</code></span>
      <span>Apps: <code>pgrep -lf</code> &middot; <code>osascript "tell app ... to quit/launch"</code></span>
      <span>USB peripherals: <code>system_profiler SPUSBDataType</code></span>

function renderRodecasterBody(device) {
  const isConnected = device.status === 'online';
  const formatLevel = lvl => lvl == null ? '' : (lvl + ' dB');
  const meterPct = lvl => {
    if (lvl == null) return 0;
    // -60 dB → 0%, 0 dB → 100%
    return Math.max(0, Math.min(100, ((lvl + 60) / 60) * 100));
  };

  return `
    <!-- USB connection bar -->
    <div class="rcp-conn-bar">
      <div class="cam-session-dot" style="background: ${isConnected ? 'var(--green)' : 'var(--red)'}"></div>
      <span>${isConnected ? 'Detected on Mac USB' : 'Not detected — check USB cable'}</span>
      <span style="color:var(--text-muted); margin-left:auto;">via ${device.detectedVia || '—'}</span>
    </div>

    <!-- Device metadata -->
    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-label">Firmware</div>
        <div class="metric-value ok" style="font-size:14px;">${device.firmware || '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Serial</div>
        <div class="metric-value ok" style="font-size:11px; font-family:'SF Mono',monospace;">${device.serial || '—'}</div>
      </div>
    </div>

    <!-- Channel strips -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Channel Strips</div>
    <div class="rcp-strip-list">
      ${(device.strips || []).map(s => `
        <div class="rcp-strip ${s.muted ? 'muted' : ''}">
          <span class="rcp-strip-name">${s.name}</span>
          <div class="rcp-meter">
            <div class="rcp-meter-fill" style="width:${meterPct(s.levelDb)}%"></div>
          </div>
          <span class="rcp-strip-icon">${s.muted ? '&#128263;' : formatLevel(s.levelDb)}</span>
        </div>
      `).join('')}
    </div>

    <!-- Limitation note -->
    <div class="device-note">
      <strong>Read-only.</strong> Rodecaster Pro II has no documented network API — it speaks USB MIDI/HID only.
      Levels and connection state come from a small bridge daemon on the Mac Studio.
      Mute/level control would require extending that daemon.
    </div>
  `;
}

function renderDawBody(device) {
  const sidecar = !!device.sidecarConnected;
  const rec = device.recording || { active: false, durationSec: 0 };
  const strips = device.strips || [];
  const activeStrips = strips.filter(s => !s.muted).length;
  const durSec = Math.floor(rec.durationSec || 0);
  const durStr = `${Math.floor(durSec/60)}:${String(durSec%60).padStart(2,'0')}`;

  return `
    <!-- Sidecar connection bar -->
    <div class="rcp-conn-bar">
      <div class="cam-session-dot" style="background: ${sidecar ? 'var(--green)' : 'var(--red)'}"></div>
      <span>${sidecar ? `Sidecar connected${device.sidecarVersion ? ' · v' + device.sidecarVersion : ''}` : 'Sidecar not connected — start studio-daw on the Mac'}</span>
      <span style="color:var(--text-muted); margin-left:auto;">${device.captureDevice || '—'} &middot; ${(device.sampleRate||0)/1000}kHz</span>
    </div>

    <!-- Summary metrics -->
    <div class="metrics-grid" style="margin-top:10px;">
      <div class="metric-item">
        <div class="metric-label">Channels</div>
        <div class="metric-value ok">${activeStrips} / ${strips.length} active</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Recording</div>
        <div class="metric-value ${rec.active ? 'error' : ''}">${rec.active ? '&#11044; REC ' + durStr : 'Idle'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Monitor</div>
        <div class="metric-value ${device.monitoring ? 'ok' : ''}">${device.monitoring ? 'On' : 'Off'}</div>
      </div>
    </div>

    <!-- Open the real mixer -->
    <div class="control-row" style="margin-top:10px;">
      <a class="ctrl-btn ctrl-btn-green" href="/studio/daw/?device=${encodeURIComponent(device.id)}" target="_blank" rel="noopener" style="text-decoration:none;">
        &#9835; Open Mixer &rarr;
      </a>
    </div>

    <div class="device-note">
      Full RØDECaster-style mixing board opens in a new tab. Faders, EQ, mute/solo, sound pad, record &amp; tracks all live there.
    </div>
  `;
}

function renderSimpleDeviceBody(device) {
  const metrics = [];
  if (device.type === 'rally-bar') {
    metrics.push({ label: 'Power', value: device.power ? 'On' : 'Off', cls: device.power ? 'ok' : 'error' });
    metrics.push({ label: 'In Call', value: device.inCall ? 'Yes' : 'No', cls: device.inCall ? 'warn' : 'ok' });
    metrics.push({ label: 'Firmware', value: device.firmware || '—', cls: 'ok' });
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Reachable' : 'Unreachable', cls: device.status === 'online' ? 'ok' : 'error' });
  } else if (device.type === 'tap') {
    metrics.push({ label: 'Power', value: device.power ? 'On' : 'Off', cls: device.power ? 'ok' : 'error' });
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Reachable' : 'Unreachable', cls: device.status === 'online' ? 'ok' : 'error' });
  } else if (device.type === 'sight') {
    metrics.push({ label: 'Power', value: device.power ? 'On' : 'Off', cls: device.power ? 'ok' : 'error' });
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Reachable' : 'Unreachable', cls: device.status === 'online' ? 'ok' : 'error' });
  } else if (device.type === 'audio') {
    metrics.push({ label: 'Power', value: device.power ? 'On' : 'Off', cls: device.power ? 'ok' : 'error' });
    metrics.push({ label: 'Status', value: device.status === 'online' ? 'Reachable' : 'Unreachable', cls: device.status === 'online' ? 'ok' : 'error' });
  }

  return `
    <div class="metrics-grid">
      ${metrics.map(m => `
        <div class="metric-item">
          <div class="metric-label">${m.label}</div>
          <div class="metric-value ${m.cls}">${m.value}</div>
        </div>
      `).join('')}
    </div>
    <div class="control-row">
      <button class="ctrl-btn ${device.power ? 'ctrl-btn-red' : 'ctrl-btn-green'}">
        &#9211; Power ${device.power ? 'Off' : 'On'}
      </button>
    </div>
  `;
}

// ══════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════

function switchCampus(campusId) {
  state.activeCampusId = campusId;
  state.currentView = 'dashboard';
  state.currentRoomId = null;
  window.location.hash = campusId;
  render();
}

function openRoom(roomId) {
  state.currentView = 'room';
  state.currentRoomId = roomId;
  window.location.hash = `${state.activeCampusId}/${roomId}`;
  render();
}

function goBack() {
  state.currentView = 'dashboard';
  state.currentRoomId = null;
  window.location.hash = state.activeCampusId;
  render();
}

// ══════════════════════════════════════════════
//  RENDER ORCHESTRATOR
// ══════════════════════════════════════════════

function render() {
  renderSidebar();
  renderBanner();
  if (state.currentView === 'room' && state.currentRoomId) {
    renderRoomDetail(state.currentRoomId);
  } else {
    renderDashboard();
  }
}

// ══════════════════════════════════════════════
//  HASH ROUTING
// ══════════════════════════════════════════════

function parseHash() {
  const hash = window.location.hash.replace('#', '');
  if (!hash) return;
  const parts = hash.split('/');
  const campusId = parts[0];
  const roomId = parts[1] || null;
  if (CONFIG.campuses.find(c => c.id === campusId)) {
    state.activeCampusId = campusId;
    if (roomId) {
      state.currentView = 'room';
      state.currentRoomId = roomId;
    } else {
      state.currentView = 'dashboard';
      state.currentRoomId = null;
    }
  }
}

// ══════════════════════════════════════════════
//  INIT
//
//  1. Fetch initial state via REST so the page paints
//     even if Socket.IO can't reach the server (e.g.
//     when WP iframes the dashboard but the WS proxy
//     isn't wired up yet).
//  2. Open the WebSocket and replace state on
//     `state:initial`, patch on `device:update`.
//  3. The refresh dot doubles as a connection indicator.
// ══════════════════════════════════════════════

function pickInitialCampus() {
  if (state.activeCampusId) return; // already set by hash
  const homeCampus = CONFIG.campuses.find(c => c.isHome);
  state.activeCampusId = homeCampus ? homeCampus.id : (CONFIG.campuses[0] && CONFIG.campuses[0].id) || null;
}

async function bootstrap() {
  // Initial REST snapshot
  try {
    const res = await fetch(`${BACKEND_URL}/api/rooms`);
    if (res.ok) {
      CONFIG = await res.json();
    } else {
      console.warn('GET /api/rooms failed', res.status);
    }
  } catch (err) {
    console.warn('GET /api/rooms error', err);
  }

  pickInitialCampus();
  parseHash();
  render();

  // Open the websocket. typeof check so we don't crash if
  // socket.io.js failed to load (e.g. cross-origin without proxy).
  if (typeof io === 'function') {
    const socket = io(BACKEND_URL || undefined, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => setConnState(true));
    socket.on('disconnect', () => setConnState(false));
    socket.on('connect_error', () => setConnState(false));

    socket.on('state:initial', (snapshot) => {
      CONFIG = snapshot;
      pickInitialCampus();
      render();
    });

    socket.on('device:update', ({ campusId, roomId, device }) => {
      if (patchDeviceInConfig(campusId, roomId, device)) {
        // Re-render only if user is currently looking at the affected room or dashboard.
        if (state.currentView === 'dashboard' || state.currentRoomId === roomId) {
          render();
        }
      }
    });

    socket.on('device:error', ({ deviceId, error }) => {
      console.warn('device error', deviceId, error);
    });
  } else {
    console.warn('socket.io client not loaded; running in REST-only mode');
    setConnState(false);
  }

  window.addEventListener('hashchange', () => {
    parseHash();
    render();
  });
}

bootstrap();
</script>
