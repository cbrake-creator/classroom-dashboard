<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Technology Health Dashboard</title>
<!-- Backend host injection point. Empty = same-origin (local dev or WP reverse proxy).
     A future host can pre-inject `window.BACKEND_URL = 'https://av-backend.dts.internal'`
     before this file loads to point at a remote backend without touching this code. -->
<script>window.BACKEND_URL = window.BACKEND_URL || '';</script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #222632;
    --bg-card-hover: #2a2f3d;
    --bg-sidebar: #161922;
    --text-primary: #e8eaf0;
    --text-secondary: #9ca3b4;
    --text-muted: #6b7280;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --green-border: rgba(34,197,94,0.3);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --red-border: rgba(239,68,68,0.3);
    --yellow: #eab308;
    --yellow-bg: rgba(234,179,8,0.12);
    --yellow-border: rgba(234,179,8,0.3);
    --gray: #6b7280;
    --gray-bg: rgba(107,114,128,0.12);
    --gray-border: rgba(107,114,128,0.3);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.12);
    --border: #2d3344;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }
  .topbar-logo span { color: var(--blue); }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .refresh-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .refresh-dot.disconnected {
    background: var(--red);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    min-height: calc(100vh - 49px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 16px;
    margin-bottom: 8px;
  }
  .campus-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .campus-item:hover { background: var(--bg-card); }
  .campus-item.active {
    background: var(--bg-card);
    border-left-color: var(--blue);
  }
  .campus-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .campus-name {
    font-size: 14px;
    font-weight: 500;
  }
  .campus-home-badge {
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-primary);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .campus-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .badge-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .badge-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }

  /* ── Alert Banner ── */
  .alert-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    background: var(--yellow-bg);
    border-bottom: 1px solid var(--yellow-border);
    font-size: 13px;
    color: var(--yellow);
  }
  .alert-banner.visible { display: flex; }
  .alert-banner-dismiss {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--yellow);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
  }

  /* ── Main Content ── */
  .main {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }

  /* ── Page Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-header h1 {
    font-size: 24px;
    font-weight: 700;
  }
  .page-header-stats {
    display: flex;
    gap: 16px;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* ── Section Headers ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    margin-top: 8px;
  }
  .section-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .section-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0 20px;
  }

  /* ── Room Cards Grid ── */
  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .room-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .room-card:hover {
    background: var(--bg-card-hover);
    border-color: #3d4355;
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .room-card-status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .room-card-status-bar.green { background: var(--green); }
  .room-card-status-bar.red { background: var(--red); }
  .room-card-status-bar.yellow { background: var(--yellow); }
  .room-card-status-bar.gray { background: var(--gray); }

  .room-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .room-card-name {
    font-size: 16px;
    font-weight: 600;
  }
  .room-card-status-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .status-icon-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .status-icon-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .status-icon-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .status-icon-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }

  .room-card-devices {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .room-device-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .room-card-issues {
    font-size: 12px;
    font-weight: 600;
    color: var(--red);
  }
  .room-card-footer {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 10px; gap: 8px;
  }
  .room-card-uptime {
    font-size: 11px; font-weight: 600; font-family: 'SF Mono', monospace;
    margin-left: auto;
  }
  .uptime-good { color: var(--green); }
  .uptime-warn { color: var(--yellow, #eab308); }
  .uptime-bad { color: var(--red); }

  /* ── Back Button ── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 16px;
  }
  .back-btn:hover { background: var(--bg-card); color: var(--text-primary); }

  /* ── Room Detail Header ── */
  .room-detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .room-detail-header h1 { font-size: 24px; font-weight: 700; }
  .room-detail-campus {
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
  }

  /* ── Device Cards Grid ── */
  .device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  /* AV.io capture preview spans every column — that's the "big preview
     screen" replacing the three Canon tiles on the Faculty Podcast room. */
  .device-card-wide { grid-column: 1 / -1; }
  .avio-switcher {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .avio-switcher-label {
    font-size: 11px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-right: 4px;
  }
  .device-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .device-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .device-card-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .device-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: var(--blue-bg);
    color: var(--blue);
  }
  .device-name {
    font-size: 15px;
    font-weight: 600;
  }
  .device-model {
    font-size: 11px;
    color: var(--text-muted);
  }
  .device-ip-link {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px dotted transparent;
  }
  .device-ip-link:hover { border-bottom-color: var(--blue); }
  .device-status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
  }
  .device-card-body { padding: 16px; }

  /* ── Camera Card ── */
  .camera-feed {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    position: relative;
    overflow: hidden;
  }
  .camera-feed-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .camera-feed-placeholder svg { opacity: 0.4; }
  .ptz-controls {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .ptz-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
  }
  .ptz-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }
  .ptz-btn.ptz-active, .zoom-btn.ptz-active {
    background: var(--blue); color: #fff; border-color: var(--blue);
  }
  /* Stop the OS long-press context menu on mobile. */
  [data-hold-url] { touch-action: none; -webkit-user-select: none; user-select: none; }
  .ptz-center { grid-column: 2; grid-row: 2; }
  .zoom-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .zoom-btn {
    width: 44px; height: 36px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .zoom-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }

  /* ── Camera Session / API Bar ── */
  .cam-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    margin-bottom: 14px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .cam-session-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
  }
  .cam-session-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .cam-api-info {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin-bottom: 14px;
    border: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cam-api-info code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    color: var(--blue);
  }
  .cam-pos-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cam-pos-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cam-pos-value {
    color: var(--text-primary);
    font-weight: 600;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .cam-livescope-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    margin-bottom: 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .cam-livescope-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .cam-livescope-warn { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .cam-livescope-err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .cam-transition-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--yellow);
    font-size: 13px;
    font-weight: 500;
  }
  .cam-transition-spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cam-snapshot-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    z-index: 2;
  }
  .cam-snapshot-btn:hover { background: rgba(0,0,0,0.8); border-color: var(--blue); }

  /* ── Control Buttons ── */
  .control-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .ctrl-btn-green:hover { background: rgba(34,197,94,0.2); }
  .ctrl-btn-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .ctrl-btn-red:hover { background: rgba(239,68,68,0.2); }
  .ctrl-btn-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .ctrl-btn-blue:hover { background: rgba(59,130,246,0.2); }
  .ctrl-btn-neutral { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border); }
  .ctrl-btn-neutral:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .ctrl-btn-active { background: var(--green); color: #000; border-color: var(--green); }

  /* ── Metrics ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .metric-item {
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .metric-value {
    font-size: 18px;
    font-weight: 700;
  }
  .metric-value.ok { color: var(--green); }
  .metric-value.warn { color: var(--yellow); }
  .metric-value.error { color: var(--red); }

  /* ── TV Input Selector ── */
  .input-display {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
  }
  .input-display.correct { background: var(--green-bg); border: 1px solid var(--green-border); }
  .input-display.incorrect { background: var(--red-bg); border: 1px solid var(--red-border); }
  .input-label { font-size: 12px; color: var(--text-muted); }
  .input-value { font-size: 15px; font-weight: 600; }
  .input-value.correct { color: var(--green); }
  .input-value.incorrect { color: var(--red); }
  .input-expected { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .input-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .input-btn {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .input-btn:hover { border-color: var(--blue); color: var(--text-primary); }
  .input-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ── Switch Port Grid ── */
  .port-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 6px;
    margin-bottom: 14px;
  }
  .port-item {
    text-align: center;
    padding: 8px 4px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    font-size: 12px;
    font-weight: 600;
  }
  .port-item .port-num { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }

  /* ── SVG Icons ── */
  .icon { display: inline-block; vertical-align: middle; }

  /* ── Studio (Faculty Podcast) ── */
  .studio-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    margin-bottom: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .preset-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .preset-panel-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

<script>
// ══════════════════════════════════════════════
//  BACKEND WIRING
//
//  CONFIG used to be a static literal in this file.
//  It is now hydrated from the backend's GET /api/rooms
//  on first paint, then continuously patched by
//  Socket.IO `device:update` events.
//
//  All device commands go through cmd(path, body) → POST.
//  No business logic in the browser.
// ══════════════════════════════════════════════

const BACKEND_URL = window.BACKEND_URL || '';

// CONFIG starts empty so render() can run before /api/rooms returns.
let CONFIG = { campuses: [] };

async function cmd(path, body) {
  try {
    const res = await fetch(`${BACKEND_URL}${path}`, {
      method: 'POST',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      const errMsg = (() => { try { return JSON.parse(text).error || text; } catch { return text; } })();
      console.warn('cmd failed', path, res.status, errMsg);
      showToast(`✗ ${path}: ${res.status} ${String(errMsg).slice(0,140)}`, 'error');
      return false;
    }
    return true;
  } catch (err) {
    console.warn('cmd error', path, err);
    showToast(`✗ ${path}: ${err.message}`, 'error');
    return false;
  }
}

// Patch a device in CONFIG by id (campusId + roomId scope guards against id collisions
// between rooms — e.g. cam-1 in multiple rooms).
function patchDeviceInConfig(campusId, roomId, device) {
  const campus = CONFIG.campuses.find(c => c.id === campusId);
  if (!campus) return false;
  const room = campus.rooms.find(r => r.id === roomId);
  if (!room) return false;
  const idx = room.devices.findIndex(d => d.id === device.id);
  if (idx < 0) return false;
  room.devices[idx] = device;
  return true;
}

function findDeviceInConfig(campusId, roomId, deviceId) {
  const campus = CONFIG.campuses.find(c => c.id === campusId);
  const room = campus && campus.rooms.find(r => r.id === roomId);
  return room ? room.devices.find(d => d.id === deviceId) : null;
}

// True when the only change between `prev` and `next` is strips[].peakDb —
// i.e. a live-meter tick that we can paint without a full re-render. Any
// field that the DAW card visually displays must be in `scalars` so a
// genuine change forces a full render and the UI doesn't lag behind state.
function isDawLevelsOnlyPatch(prev, next) {
  if (!prev || !next || prev.type !== 'daw' || next.type !== 'daw') return false;
  const scalars = [
    'status','sidecarConnected','sidecarVersion','captureDevice','sampleRate',
    'monitoring','outputDir',
    // Health fields rendered as red/orange pills in the connection bar.
    // Without these, deviceState 'missing'→'present' (and the reverse) gets
    // misclassified as a levels-only tick and the pill never clears — user
    // sees "Capture device missing" until they manually refresh.
    'micState','deviceState',
  ];
  for (const k of scalars) if (prev[k] !== next[k]) return false;
  if (JSON.stringify(prev.recording||null) !== JSON.stringify(next.recording||null)) return false;
  // Audio-stale pill: shown when lastPeakAgeMs > 5000 AND deviceState='present'.
  // Treat it as "changed" only when the value crosses that threshold — otherwise
  // every 2s health tick would force a full render (lastPeakAgeMs ticks up
  // continuously).
  const STALE_MS = 5000;
  const prevStale = (prev.lastPeakAgeMs ?? 0) > STALE_MS;
  const nextStale = (next.lastPeakAgeMs ?? 0) > STALE_MS;
  if (prevStale !== nextStale) return false;
  const a = prev.strips || [], b = next.strips || [];
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i].channel !== b[i].channel || a[i].name !== b[i].name ||
        a[i].muted !== b[i].muted || a[i].solo !== b[i].solo ||
        a[i].faderDb !== b[i].faderDb) return false;
  }
  return true;
}

// Peak-hold state per device+channel. Instant attack on rising peaks,
// constant-dB-per-second decay on fall. Without this the bars strobe between
// each sidecar tick (~20 Hz) because individual 50 ms audio windows often
// contain a peak followed by near-silence.
const dawMeterState = new Map(); // key: device.id  → { lastTick, peaks: number[], holdPeaks: number[] }
const METER_DECAY_DB_PER_SEC = 40; // VU-style fall-off
const PEAK_HOLD_MS = 800;          // keep the little peak dot fixed briefly

// In-place meter update — no innerHTML rewrite, so clicks on other controls
// in the same card/page don't get dropped.
function updateDawMeters(device) {
  const card = document.querySelector(`.device-card[data-device-id="${device.id}"]`);
  if (!card) return;
  const rows = card.querySelectorAll('.rcp-strip[data-group-indices]');
  const strips = device.strips || [];
  const fmt = p => (p == null || p <= -120) ? '—' : (p >= 0 ? '0' : p.toFixed(0)) + ' dB';
  const pct = p => (p == null) ? 0 : Math.max(0, Math.min(100, ((p + 60) / 60) * 100));

  let st = dawMeterState.get(device.id);
  const now = performance.now();
  if (!st) {
    st = { lastTick: now, peaks: new Array(rows.length).fill(-120) };
    dawMeterState.set(device.id, st);
  }
  const dt = Math.max(0, (now - st.lastTick) / 1000);
  st.lastTick = now;
  const decay = METER_DECAY_DB_PER_SEC * dt;

  rows.forEach((row, gi) => {
    const indices = row.dataset.groupIndices.split(',').map(Number);
    // Max peakDb across the group's channels (stereo pair -> louder of L/R)
    const raw = Math.max(...indices.map(i => (strips[i]?.peakDb ?? -120)));
    if (st.peaks[gi] === undefined) st.peaks[gi] = -120;
    const shown = (raw > st.peaks[gi]) ? raw : Math.max(raw, st.peaks[gi] - decay);
    st.peaks[gi] = shown;
    const fill = row.querySelector('.rcp-meter-fill');
    if (fill) fill.style.width = pct(shown) + '%';
  });
}

function setConnState(connected) {
  const dot = document.getElementById('refreshDot');
  const label = document.getElementById('lastRefresh');
  const conn = document.getElementById('connState');
  if (!dot || !label || !conn) return;
  if (connected) {
    dot.classList.remove('disconnected');
    label.textContent = 'Live';
    conn.textContent = 'WebSocket';
  } else {
    dot.classList.add('disconnected');
    label.textContent = 'Disconnected';
    conn.textContent = 'Reconnecting…';
  }
}

function getDeviceIssues(device) {
  const issues = [];
  // DAW is push-based (sidecar opens a socket and emits state) — it never
  // goes through the HTTP poller, so the poller's 'unknown' marker is
  // meaningless here. Its real status bubbles up via sidecarConnected.
  if (device.status === 'offline' && device.type !== 'daw') issues.push('Device offline');
  if (device.status === 'unknown' && device.type !== 'daw') issues.push('Status unknown (no live poll yet)');
  if (device.type === 'daw' && !device.sidecarConnected) issues.push('DAW sidecar not connected');
  if (device.type === 'display' && device.power === false) issues.push('Powered off');
  if (device.type === 'display' && device.currentInput !== device.correctInput) issues.push(`Wrong input (${device.currentInput}, expected ${device.correctInput})`);
  if (device.type === 'camera' && device.power === false) issues.push('Camera off');
  if (device.type === 'nuc' && device.power === false) issues.push('NUC off');
  if (device.type === 'nuc' && device.cpu > 80) issues.push('High CPU');
  if (device.type === 'rally-bar' && device.power === false) issues.push('Rally Bar off');
  if (device.type === 'tap' && device.power === false) issues.push('Tap off');
  if (device.type === 'sight' && device.power === false) issues.push('Sight off');
  if (device.type === 'audio' && device.power === false) issues.push('Audio off');
  if (device.type === 'network-switch' && device.ports) {
    const downPorts = device.ports.filter(p => !p.up);
    if (downPorts.length > 0) issues.push(`${downPorts.length} port(s) down`);
  }
  if (device.type === 'pearl') {
    if (device.cpu > 80) issues.push('Pearl CPU high');
    if (device.temp && device.temp > 75) issues.push('Pearl temperature high');
    if (device.storage && (device.storage.freeGb / device.storage.totalGb) < 0.10) issues.push('Pearl storage <10%');
    // Per-source connected state is shown as green/grey dots in the Inputs
    // section — no need to also shout it as a card-level error. Empty ports
    // (HDMI-B with no cable) aren't really issues, just unused.
  }
  if (device.type === 'mac') {
    if (device.cpu > 80) issues.push('Mac CPU high');
    if (device.mem > 85) issues.push('Mac memory high');
    if (device.disk && (device.disk.freeGb / device.disk.totalGb) < 0.10) issues.push('Mac disk <10%');
  }
  return issues;
}

function getRoomHealth(room) {
  let totalIssues = 0;
  room.devices.forEach(d => { totalIssues += getDeviceIssues(d).length; });
  if (totalIssues === 0) return 'green';
  if (totalIssues <= 2) return 'yellow';
  return 'red';
}

function getRoomIssueCount(room) {
  let count = 0;
  room.devices.forEach(d => { count += getDeviceIssues(d).length; });
  return count;
}

function getCampusIssueCount(campus) {
  let count = 0;
  campus.rooms.forEach(r => { count += getRoomIssueCount(r); });
  return count;
}

function getDeviceStatusColor(device) {
  return getDeviceIssues(device).length > 0 ? 'red' : 'green';
}

function deviceIcon(type) {
  const icons = {
    camera: '&#9673;',          // camera
    nuc: '&#9634;',             // computer
    'network-switch': '&#8644;', // switch
    display: '&#9632;',         // screen
    'rally-bar': '&#9654;',     // video bar
    tap: '&#9641;',             // touch controller
    sight: '&#9673;',           // AI camera
    audio: '&#9835;',           // audio
    pearl: '&#9210;',           // encoder/recorder
    mac: '&#63743;',            // mac (Apple logo PUA — falls back gracefully)
    rodecaster: '&#9836;',      // mixer
    daw: '&#9835;',             // DAW / console
    avio: '&#128249;'           // film camera — capture card / live preview

  return icons[type] || '&#9679;';
}

function deviceTypeName(type) {
  const names = {
    camera: 'Camera', nuc: 'Computer', 'network-switch': 'Switch', display: 'Display',

    avio: 'Capture'
  };
  return names[type] || type;
}

function renderBanner() {
  if (state.dismissedBanner) return;
  const banner = document.getElementById('alertBanner');
  const homeCampus = CONFIG.campuses.find(c => c.isHome);
  const otherIssues = CONFIG.campuses
    .filter(c => !c.isHome)
    .filter(c => getCampusIssueCount(c) > 0);

  if (otherIssues.length > 0) {
    const text = otherIssues.map(c => `${c.name}: ${getCampusIssueCount(c)} issue(s)`).join(' &middot; ');
    document.getElementById('alertBannerText').innerHTML = text;
    banner.classList.add('visible');

    banner.classList.remove('visible');
  }
}

function renderRoomCard(room) {
  const health = getRoomHealth(room);
  const issues = getRoomIssueCount(room);
  const statusIcons = { green: '&#10003;', yellow: '&#9888;', red: '&#10007;' };
  const uptime = uptimeByRoom.get(room.id);
  const uptimeCls = uptime === undefined ? '' : uptime >= 99 ? 'uptime-good' : uptime >= 95 ? 'uptime-warn' : 'uptime-bad';

  return `
    <div class="room-card" onclick="openRoom('${room.id}')">
      <div class="room-card-status-bar ${health}"></div>
      <div class="room-card-top">
        <span class="room-card-name">${room.name}</span>
        <div class="room-card-status-icon status-icon-${health}">
          ${statusIcons[health]}
        </div>
      </div>
      <div class="room-card-devices">
        ${room.devices.map(d => {
          const color = getDeviceStatusColor(d) === 'green' ? 'var(--green)' : 'var(--red)';
          return `<div class="room-device-pip" style="background:${color}" title="${deviceTypeName(d.type)}: ${d.brand}"></div>`;
        }).join('')}
      </div>
      <div class="room-card-footer">
        ${issues > 0 ? `<span class="room-card-issues">${issues} issue${issues !== 1 ? 's' : ''}</span>` : '<span></span>'}
        ${uptime !== undefined ? `<span class="room-card-uptime ${uptimeCls}" title="7-day uptime">${uptime.toFixed(1)}%</span>` : ''}
      </div>
    </div>
  `;
}

// Uptime % per room — populated from /api/uptime, refreshed every 60s.
const uptimeByRoom = new Map();
async function refreshUptime() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/uptime`);
    if (!res.ok) return;
    const data = await res.json();
    for (const r of data.rooms || []) uptimeByRoom.set(r.roomId, r.uptimePct);
  } catch (err) { /* swallow */ }
}
refreshUptime();
setInterval(refreshUptime, 60000);

// Per-room device ordering + filtering. The Faculty Podcast room replaces its
// three Canon camera tiles with a single big AV.io capture-card preview
// showing the Pearl's HDMI 1 program output — the cameras are still in the
// fixture state (room-level multi-cam presets need them, and the Pearl HDMI
// feed is composed from their inputs) but they're not rendered as cards.
// Other rooms render every device.
function orderedRoomDevices(room) {
  let devs = room.devices;
  if (room.id === 'faculty-podcast') {
    devs = devs.filter(d => d.type !== 'camera');
    // Float the AV.io tile to the top so it lands above Pearl / DAW / Mac.
    devs.sort((a, b) => (a.type === 'avio' ? -1 : 0) - (b.type === 'avio' ? -1 : 0));
  }
  return devs;
}

function renderRoomDetail(roomId, viewChanged) {

    <div class="device-grid">
      ${orderedRoomDevices(room).map(d => renderDeviceCard(d)).join('')}

  `;
  // Room-level multi-cam preset panel: Tech Talks only.
  // Faculty Podcast used to share this UI but no longer needs it — its three
  // Canon CR-N300s were replaced by R5Cs feeding Pearl over HDMI, so per-camera
  // PTZ presets aren't meaningful there. (See project_studio_cameras.md.)
  // Classrooms get 3 per-camera presets rendered inside each camera card instead.
  if (room.type === 'studio' && room.devices.some(d => d.type === 'camera') && room.id !== 'faculty-podcast') {
    if (presetState.has(room.id)) {
      renderPresetPanel(room.id);
    } else if (viewChanged !== false) {
      loadAndRenderPresets(room.id);

  // Classroom per-camera 3-slot preset bars are painted after the card HTML

      // Lazy-load presets for this room then paint the 3 slots for THIS cam.
      if (!presetState.has(room.id)) {
        loadAndRenderPresets(room.id).then(() => paintCamPresetStrip(room.id, cam.id));

// ── Per-camera preset strip (for classroom Canon cards) ───
// Reuses the same /api/presets backend, just pins to slots 1-3 of the room's
// preset array and scopes positions to a single camera id.
function paintCamPresetStrip(roomId, cameraId) {
  const host = document.getElementById(`cam-preset-strip-${cameraId}`);
  if (!host) return;
  const data = presetState.get(roomId);
  if (!data) return;
  const slots = data.presets.slice(0, 3);
  host.innerHTML = `
    <div class="cam-preset-label">Presets</div>
    ${slots.map(p => {
      const saved = cameraId in (p.positions || {});
      return `
        <div class="cam-preset-tile ${saved ? 'saved' : 'empty'}">
          <input class="cam-preset-name" value="${escapeAttr(p.name.startsWith('Preset ') ? (p.name.replace('Preset ', '') || '') : p.name)}"
                 data-roomid="${roomId}" data-slot="${p.slot}"
                 onblur="savePresetName(this)" onkeydown="if(event.key==='Enter')this.blur()"
                 title="Rename — press Enter or click away to save">
          <div class="cam-preset-btns">
            <button class="cam-preset-btn cam-preset-recall" onclick="recallCamPreset('${roomId}', ${p.slot}, '${cameraId}')" ${saved ? '' : 'disabled'} title="Move camera to this position">&#9658;</button>
            <button class="cam-preset-btn cam-preset-save" onclick="captureCamPreset('${roomId}', ${p.slot}, '${cameraId}')" title="Save current position">&#128190;</button>
          </div>
        </div>`;
    }).join('')}
  `;
}

// Single-cam capture: read current cam position, PUT the preset with just
// this camera's position (preserves any existing other-cam entries).
async function captureCamPreset(roomId, slot, cameraId) {
  showToast(`Saving preset ${slot}...`, 'info');
  // Read current position from local state (device:update keeps it fresh).
  const room = CONFIG.campuses.flatMap(c => c.rooms).find(r => r.id === roomId);
  const cam = room?.devices.find(d => d.id === cameraId);
  if (!cam) {
    showToast('✗ camera not found', 'error');
    return;
  }
  // Merge with existing positions so we don't wipe other cams' entries.
  const existing = presetState.get(roomId)?.presets.find(p => p.slot === slot)?.positions || {};
  const positions = {
    ...existing,
    [cameraId]: { pan: cam.panPos, tilt: cam.tiltPos, zoom: cam.zoomPos },
  };
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ positions }),
  });
  if (!res.ok) {
    showToast(`✗ save: ${res.status}`, 'error');
    return;
  }
  await loadAndRenderPresets(roomId);
  paintCamPresetStrip(roomId, cameraId);
  showToast(`✓ Preset ${slot} saved`, 'info');
}

async function recallCamPreset(roomId, slot, cameraId) {
  // The room-level /recall endpoint moves every cam in the preset. For a
  // classroom with one camera, that's exactly what we want.
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}/recall`, { method: 'POST' });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    showToast(`✗ recall: ${res.status} ${txt.slice(0,120)}`, 'error');
    return;
  }
  showToast(`✓ Recalled preset ${slot}`, 'info');
}

// ── Multi-cam presets ─────────────────────────────────────
const presetState = new Map(); // roomId → { cameras, presets }

async function loadAndRenderPresets(roomId) {
  try {
    const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}`);
    if (!res.ok) return;
    const data = await res.json();
    presetState.set(roomId, data);
    renderPresetPanel(roomId);
  } catch (err) {
    console.warn('failed to load presets', err);
  }
}

function renderPresetPanel(roomId) {
  const host = document.getElementById(`preset-panel-${roomId}`);
  if (!host) return;
  const data = presetState.get(roomId);
  if (!data) return;
  const camCount = data.cameras.length;
  host.innerHTML = `
    <div class="preset-panel">
      <div class="preset-panel-header">
        <span class="preset-panel-title">&#9680; Multi-Cam Presets</span>
        <span class="preset-panel-sub">Click to recall · double-click name to rename · &#128190; to save current positions (${camCount} cam${camCount === 1 ? '' : 's'})</span>
      </div>
      <div class="preset-grid">
        ${data.presets.map((p) => {
          const saved = Object.keys(p.positions || {}).length;
          const savedCls = saved === camCount && camCount > 0 ? 'preset-saved' : saved > 0 ? 'preset-partial' : 'preset-empty';
          return `
            <div class="preset-tile ${savedCls}">
              <div class="preset-slot-n">${p.slot}</div>
              <input class="preset-name" value="${escapeAttr(p.name)}" data-roomid="${roomId}" data-slot="${p.slot}"
                     onblur="savePresetName(this)" onkeydown="if(event.key==='Enter')this.blur()">
              <div class="preset-actions">
                <button class="preset-btn preset-btn-recall" onclick="recallPreset('${roomId}', ${p.slot})" title="Move all cameras to this preset" ${saved ? '' : 'disabled'}>&#9658; Recall</button>
                <button class="preset-btn preset-btn-save" onclick="capturePreset('${roomId}', ${p.slot})" title="Save current camera positions">&#128190;</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function escapeAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

async function savePresetName(inputEl) {
  const roomId = inputEl.dataset.roomid;
  const slot = Number(inputEl.dataset.slot);
  const name = inputEl.value.trim() || `Preset ${slot}`;
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!res.ok) {
    showToast(`✗ rename preset ${slot}: ${res.status}`, 'error');
  }
  // Refresh local state so re-renders show the new name.
  const data = presetState.get(roomId);
  if (data) {
    const p = data.presets.find((x) => x.slot === slot);
    if (p) p.name = name;
  }
}

async function capturePreset(roomId, slot) {
  showToast(`Capturing positions for preset ${slot}...`, 'info');
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}/capture`, { method: 'POST' });
  if (!res.ok) {
    showToast(`✗ capture: ${res.status}`, 'error');
    return;
  }
  await loadAndRenderPresets(roomId);
  showToast(`✓ Preset ${slot} saved`, 'info');
}

async function recallPreset(roomId, slot) {
  const res = await fetch(`${BACKEND_URL}/api/presets/${roomId}/${slot}/recall`, { method: 'POST' });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    showToast(`✗ recall: ${res.status} ${txt.slice(0,120)}`, 'error');
    return;
  }
  const data = await res.json();
  const errs = (data.results || []).filter((r) => r.error);
  if (errs.length) {
    showToast(`⚠ Recall partial: ${errs.length} cam(s) failed`, 'error');
  } else {
    showToast(`✓ Recalled "${data.preset}"`, 'info');
  }
}

function getStudioSession(room) {
  const pearl = room.devices.find(d => d.type === 'pearl');
  if (!pearl) return { live: false, label: 'No Encoder', sub: 'No Pearl device in this room' };
  const recording = (pearl.recorders || []).some(r => r.state === 'recording');
  const streaming = (pearl.publishers || []).some(p => p.state === 'streaming');
  if (recording && streaming) return { live: true, label: 'LIVE — Recording + Streaming', sub: 'Pearl encoder is recording to disk and pushing RTMP' };
  if (recording) return { live: true, label: 'RECORDING', sub: 'Pearl recorder is active' };
  if (streaming) return { live: true, label: 'STREAMING', sub: 'Pearl publisher is active' };
  return { live: false, label: 'Idle', sub: 'No active recording or stream' };
}

function renderStudioSessionBar(room) {
  const sess = getStudioSession(room);
  const liveCls = sess.live ? 'live' : '';
  return `
    <div class="studio-session-bar ${liveCls}">
      <div class="studio-session-bar-left">
        <button class="studio-rec-btn ${sess.live ? 'active' : ''}"
                onclick="cmd('/api/studio/${room.id}/start-session')"
                title="POST /api/studio/${room.id}/start-session">
          <span class="studio-rec-dot"></span>
          <span class="studio-rec-label">REC</span>
        </button>
        <button class="studio-stop-btn"
                onclick="cmd('/api/studio/${room.id}/kill')"
                title="POST /api/studio/${room.id}/kill — stop Pearl recorder/streams + DAW, release cameras.">
          <span class="studio-stop-square"></span>
          <span class="studio-stop-label">STOP</span>
        </button>
        <div class="studio-live-dot"></div>
        <div>
          <div class="studio-session-title">${sess.label}</div>
          <div class="studio-session-sub">${sess.sub}</div>

      </div>
      <div class="studio-session-actions">

          Prep Studio
        </button>
        <button class="studio-shutdown-btn"
                onclick="confirmStudioShutdown('${room.id}', '${(room.name||'').replace(/'/g,'&#39;')}')"
                title="POST /api/studio/${room.id}/room-off — cameras→standby + Pearl shutdown">
          Studio Shutdown
        </button>

    </div>
  `;
}

// Turn an IP into a clickable link to the device's own web UI when we know
// one exists. Canon CR-N300 and Epiphan Pearl 2 both serve their admin UI
// on port 80; other device types either have no web UI or live behind VPN
// creds we don't control, so those stay as plain text.
function renderDeviceIpLink(device) {
  const ip = device.ip;
  if (!ip || ip.includes('via ')) return ip; // skip things like "via mac-1 USB"
  const hasWebUi = device.type === 'camera' || device.type === 'pearl';
  if (!hasWebUi) return ip;
  const url = device.type === 'camera' ? `http://${ip}/` : `http://${ip}/`;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="device-ip-link" title="Open ${deviceTypeName(device.type)} admin UI in new tab">${ip} &#8599;</a>`;
}

function renderDeviceCard(device) {
  const issues = getDeviceIssues(device);
  const statusColor = issues.length > 0 ? 'red' : 'green';
  const statusText = issues.length > 0 ? issues[0] : 'Online';
  const badgeClass = statusColor === 'green' ? 'badge-green' : 'badge-red';

  let body = '';

  if (device.type === 'camera') {
    body = renderCameraBody(device);
  } else if (device.type === 'nuc') {
    body = renderNucBody(device);
  } else if (device.type === 'network-switch') {
    body = renderSwitchBody(device);
  } else if (device.type === 'display') {
    body = renderDisplayBody(device);
  } else if (device.type === 'rally-bar' || device.type === 'tap' || device.type === 'sight' || device.type === 'audio') {
    body = renderSimpleDeviceBody(device);
  } else if (device.type === 'pearl') {
    body = renderPearlBody(device);
  } else if (device.type === 'mac') {
    body = renderMacBody(device);
  } else if (device.type === 'rodecaster') {
    body = renderRodecasterBody(device);
  } else if (device.type === 'daw') {
    body = renderDawBody(device);
  } else if (device.type === 'avio') {
    body = renderAvioBody(device);
  }

  // The AV.io capture-card preview should span the full row in the studio
  // grid — it's the "big preview screen" replacing the three camera tiles.
  const cardClass = device.type === 'avio' ? 'device-card device-card-wide' : 'device-card';

  return `
    <div class="${cardClass}" data-device-id="${device.id}">
      <div class="device-card-header">
        <div class="device-card-header-left">
          <div class="device-icon">${deviceIcon(device.type)}</div>
          <div>
            <div class="device-name">${device.label ? device.label + ' — ' : deviceTypeName(device.type) + ' — '}${device.brand}</div>
            <div class="device-model">${device.model || ''} &middot; ${renderDeviceIpLink(device)}</div>
          </div>
        </div>
        <span class="device-status-badge ${badgeClass}">${statusText}</span>
      </div>
      <div class="device-card-body">
        ${body}
      </div>
    </div>
  `;
}

function renderCameraBody(device) {
  const isOnline = device.status === 'online';
  const isTransitioning = device.powerTransition != null;

  // Livescope status display
  const lsCode = device.livescopeStatus || 0;
  let lsClass = 'cam-livescope-ok';
  let lsText = `Livescope: ${lsCode} OK`;
  if (!isOnline) { lsClass = 'cam-livescope-err'; lsText = 'Livescope: Unreachable'; }
  else if (lsCode === 301) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 301 — In use by another client'; }
  else if (lsCode === 503) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 503 — Too many clients'; }
  else if (lsCode === 509) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 509 — Standby'; }
  else if (lsCode === 510) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 510 — Entering standby...'; }
  else if (lsCode === 511) { lsClass = 'cam-livescope-warn'; lsText = 'Livescope: 511 — Waking up...'; }
  else if (lsCode === 507) { lsClass = 'cam-livescope-err'; lsText = 'Livescope: 507 — Auth failed'; }

  // Power state text
  let powerLabel = device.power ? 'Standby' : 'Wake';
  let powerBtnClass = device.power ? 'ctrl-btn-red' : 'ctrl-btn-green';
  if (device.powerTransition === 'standby-pending') { powerLabel = 'Entering Standby...'; powerBtnClass = 'ctrl-btn-neutral'; }
  else if (device.powerTransition === 'waking') { powerLabel = 'Waking Up...'; powerBtnClass = 'ctrl-btn-neutral'; }

  return `
    <div class="camera-feed">
      ${isOnline ? `<button class="cam-snapshot-btn" onclick="window.open(BACKEND_URL + '/api/canon/${device.id}/snapshot', '_blank')" title="GET /api/canon/${device.id}/snapshot">&#128247; Snapshot</button>` : ''}
      ${isTransitioning ? `
        <div class="cam-transition-overlay">
          <div class="cam-transition-spinner"></div>
          <span>${device.powerTransition === 'waking' ? 'Camera starting up...' : 'Camera shutting down...'}</span>
        </div>
      ` : ''}
      ${isOnline
        ? `<div class="cam-preview-slot" data-deviceid="${device.id}" style="width:100%; height:100%; background:#000; position:relative;"></div>`
        : `<div class="camera-feed-placeholder">
             <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
               <rect x="2" y="5" width="15" height="14" rx="2"/>
               <polygon points="22,7 17,12 22,17"/>
             </svg>
             <span>Camera Offline</span>
           </div>`}
    </div>

    <!-- Livescope Status -->
    <div class="cam-livescope-bar ${lsClass}">
      <span>${lsText}</span>
    </div>

    <!-- Session & Control (XC Protocol) -->
    <div class="cam-session-bar">
      <div class="cam-session-bar-left">
        <div class="cam-session-dot" style="background: ${isOnline ? 'var(--green)' : 'var(--red)'}"></div>
        <span>${isOnline ? 'XC Protocol' : 'Unreachable'}</span>
        <span style="color:var(--text-muted); font-size:11px;">${device.auth && device.auth.enabled ? '&#128274; Auth' : '&#128275; Open'}</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="ctrl-btn ctrl-btn-blue" style="padding:4px 10px; font-size:11px;" onclick="cmd('/api/canon/${device.id}/claim')" title="POST /api/canon/${device.id}/claim">
          ${device.controlClaimed ? '&#9679; Control Claimed' : '&#9675; Claim Control'}
        </button>
        <button class="ctrl-btn ctrl-btn-neutral" style="padding:4px 10px; font-size:11px;" onclick="cmd('/api/canon/${device.id}/release')" title="POST /api/canon/${device.id}/release">
          Release
        </button>
      </div>
    </div>

    <!-- PTZ Position Readout (from info.cgi) -->
    <div class="cam-pos-bar">
      <div class="cam-pos-item">Pan <span class="cam-pos-value">${isOnline ? device.panPos + '&deg;' : '—'}</span></div>
      <div class="cam-pos-item">Tilt <span class="cam-pos-value">${isOnline ? device.tiltPos + '&deg;' : '—'}</span></div>
      <div class="cam-pos-item">Zoom <span class="cam-pos-value">${isOnline ? device.zoomPos + '%' : '—'}</span></div>
    </div>

    <!-- PTZ Controls (control.cgi). Press-and-hold for continuous move
         via the global pointerdown handler installed in attachPtzHold(). -->
    <div class="ptz-controls">
      <div></div>
      <button class="ptz-btn" data-hold-url="/api/canon/${device.id}/ptz" data-hold-body='{"action":"tilt-up"}' title="Tilt Up">&#9650;</button>
      <div></div>
      <button class="ptz-btn" data-hold-url="/api/canon/${device.id}/ptz" data-hold-body='{"action":"pan-left"}' title="Pan Left">&#9664;</button>
      <button class="ptz-btn ptz-center" onclick="cmd('/api/canon/${device.id}/home')" title="Home Preset">&#8962;</button>
      <button class="ptz-btn" data-hold-url="/api/canon/${device.id}/ptz" data-hold-body='{"action":"pan-right"}' title="Pan Right">&#9654;</button>
      <div></div>
      <button class="ptz-btn" data-hold-url="/api/canon/${device.id}/ptz" data-hold-body='{"action":"tilt-down"}' title="Tilt Down">&#9660;</button>
      <div></div>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" data-hold-url="/api/canon/${device.id}/zoom" data-hold-body='{"direction":"out"}' title="Zoom Out">&minus;</button>
      <button class="zoom-btn" data-hold-url="/api/canon/${device.id}/zoom" data-hold-body='{"direction":"in"}' title="Zoom In">&plus;</button>
    </div>

    <!-- 3-slot per-camera presets (classroom rooms only; studios use the room-level multi-cam panel) -->
    <div id="cam-preset-strip-${device.id}" class="cam-preset-strip"></div>

    <!-- Camera Actions -->
    <div class="control-row">
      <button class="ctrl-btn ${device.autoTrack ? 'ctrl-btn-active' : device.autoTrackAvailable ? 'ctrl-btn-green' : 'ctrl-btn-neutral'}"
              onclick="cmd('/api/canon/${device.id}/autotrack', { enabled: ${!device.autoTrack} })"
              ${device.autoTrackAvailable ? '' : 'disabled'}
              title="${device.autoTrackAvailable ? 'Toggle Canon RA-AT001 Auto Tracking' : 'Unavailable — ' + (device.autoTrackReason || 'app not running or unlicensed')}">
        &#9678; Auto-Track ${device.autoTrack ? 'ON' : device.autoTrackAvailable ? 'OFF' : 'N/A'}
      </button>
      <button class="ctrl-btn ${powerBtnClass}" onclick="cmd('/api/canon/${device.id}/standby', { on: ${!!device.power} })" title="POST /api/canon/${device.id}/standby">
        &#9211; ${powerLabel}
      </button>
    </div>

    <!-- API Reference -->
    <div class="cam-api-info">
      <span>XC Protocol v011 &middot; Canon ${device.model}</span>
      <span>Status: <code>info.cgi</code> &middot; PTZ: <code>control.cgi</code> &middot; Stream: <code>video.cgi?w=1</code></span>
      <span>Power: <code>standby.cgi</code> &middot; Snap: <code>image.cgi?w=1</code></span>
      <span>Session: <code>open → claim → yield → close</code></span>
    </div>
  `;
}

function renderNucBody(device) {
  const cpuClass = device.cpu > 80 ? 'error' : device.cpu > 60 ? 'warn' : 'ok';
  const memClass = device.mem > 80 ? 'error' : device.mem > 60 ? 'warn' : 'ok';

  return `
    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-label">CPU Usage</div>
        <div class="metric-value ${cpuClass}">${device.power ? device.cpu + '%' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Memory</div>
        <div class="metric-value ${memClass}">${device.power ? device.mem + '%' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Power</div>
        <div class="metric-value ${device.power ? 'ok' : 'error'}">${device.power ? 'On' : 'Off'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Status</div>
        <div class="metric-value ${device.status === 'online' ? 'ok' : 'error'}">${device.status === 'online' ? 'Reachable' : 'Unreachable'}</div>
      </div>
    </div>
    <div class="control-row">
      <button class="ctrl-btn ctrl-btn-red" title="Reboot NUC">&#8635; Reboot</button>

        &#9211; Power ${device.power ? 'Off' : 'On'}

    </div>

}

function renderSwitchBody(device) {
  return `
    <div class="port-grid">
      ${(device.ports || []).map(p => {

        return `
          <div class="port-item" style="border: 1px solid ${color}">

            <div style="color: ${color}; font-size: 14px;">${p.up ? '&#9679;' : '&#9675;'}</div>

      }).join('')}

    <div style="font-size: 12px; color: var(--text-muted);">Read-only &middot; SNMP monitoring</div>

}

function renderDisplayBody(device) {
  const isCorrect = device.currentInput === device.correctInput;
  const inputs = ['HDMI1', 'HDMI2', 'HDMI3', 'DP1'];

  return `
    <div class="input-display ${isCorrect ? 'correct' : 'incorrect'}">
      <div>
        <div class="input-label">Current Input</div>
        <div class="input-value ${isCorrect ? 'correct' : 'incorrect'}">${device.currentInput} ${isCorrect ? '&#10003;' : '&#10007;'}</div>
        ${!isCorrect ? `<div class="input-expected">Expected: ${device.correctInput}</div>` : ''}
      </div>
    </div>
    <div class="input-buttons">
      ${inputs.map(inp => `
        <button class="input-btn ${device.currentInput === inp ? 'active' : ''}">${inp}</button>
      `).join('')}
    </div>
    <div class="control-row">
      <button class="ctrl-btn ${device.power ? 'ctrl-btn-red' : 'ctrl-btn-green'}">
        &#9211; Power ${device.power ? 'Off' : 'On'}
      </button>
    </div>
  `;
}

function renderPearlBody(device) {
  const isOnline = device.status === 'online';
  const recording = (device.recorders || []).some(r => r.state === 'recording');
  const streaming = (device.publishers || []).some(p => p.state === 'streaming');
  const storagePctFree = device.storage ? Math.round((device.storage.freeGb / device.storage.totalGb) * 100) : 0;
  const cpuClass = device.cpu > 80 ? 'error' : device.cpu > 60 ? 'warn' : 'ok';
  const tempClass = device.temp > 75 ? 'error' : device.temp > 65 ? 'warn' : 'ok';
  const storageClass = storagePctFree < 10 ? 'error' : storagePctFree < 25 ? 'warn' : 'ok';

  const activeRec = (device.recorders || []).find(r => r.state === 'recording');
  const pearlDurSec = activeRec ? Math.floor(activeRec.durationSec || 0) : 0;

  // Stash the current "known duration" for the client-side per-second ticker.
  // The ticker reads this on every tick and draws: known + (now - recvTime)/1000.
  pearlRecState.set(device.id, { recording, baseSec: pearlDurSec, baseAt: Date.now() });

  return `
    <!-- Pearl's per-card REC button was removed in favour of the single
         room-level REC in the studio session bar, which fires Pearl + DAW
         recording in one click. Recording state pills below still reflect
         the current Pearl state. -->

    <!-- Recent recordings (loaded async; click to play in-browser) -->
    <div id="pearl-recordings-${device.id}" class="pearl-recordings"></div>

    <!-- Encoder state pills -->
    <div class="pearl-state-row">
      ${recording
        ? '<span class="pearl-pill rec"><span class="dot"></span>REC</span>'
        : '<span class="pearl-pill idle">REC OFF</span>'}
      ${streaming
        ? '<span class="pearl-pill stream">&#9673; STREAMING</span>'
        : '<span class="pearl-pill idle">STREAM OFF</span>'}
      <span class="pearl-pill">FW ${device.firmware || '—'}</span>
      <span class="pearl-pill">UP ${device.uptime || '—'}</span>
    </div>

    <!-- Channels (encoders) -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Channels</div>
    <div class="pearl-channel-list">
      ${(device.channels || []).map(ch => `
        <div class="pearl-channel">
          <div>
            <div class="pearl-channel-name">${ch.name}</div>
            <div class="pearl-channel-meta">Layout: ${ch.currentLayout}</div>
          </div>
          <div class="pearl-channel-meta">${ch.fps}fps &middot; ${(ch.bitrateKbps/1000).toFixed(1)}Mbps</div>
        </div>
      `).join('')}
    </div>

    <!-- Sources -->
    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Inputs</div>
    <div class="pearl-source-grid">
      ${(device.sources || []).map(s => `
        <div class="pearl-source-item">
          <div class="pearl-source-dot ${s.connected ? 'up' : 'down'}"></div>
          <div class="pearl-source-text">
            <span class="pearl-source-name">${s.name}</span>
            <span class="pearl-source-label">${s.label}</span>
          </div>
        </div>
      `).join('')}
    </div>

    <!-- System metrics -->
    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-label">CPU</div>
        <div class="metric-value ${cpuClass}">${isOnline ? device.cpu + '%' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Temperature</div>
        <div class="metric-value ${tempClass}">${isOnline ? device.temp + '&deg;C' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Storage Free</div>
        <div class="metric-value ${storageClass}">${isOnline && device.storage ? storagePctFree + '%' : '—'}</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Storage</div>
        <div class="metric-value ok" style="font-size:13px;">${device.storage ? device.storage.freeGb + ' / ' + device.storage.totalGb + ' GB' : '—'}</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="control-row">
      ${(device.recorders || []).map(r => `
        <button class="ctrl-btn ${r.state === 'recording' ? 'ctrl-btn-red' : 'ctrl-btn-green'}"
                onclick="cmd('/api/pearl/${device.id}/recorder/${r.id}/${r.state === 'recording' ? 'stop' : 'start'}')"
                title="POST /api/pearl/${device.id}/recorder/${r.id}/${r.state === 'recording' ? 'stop' : 'start'}">
          ${r.state === 'recording' ? '&#9632; Stop' : '&#9679; Rec'} ${r.name}
        </button>
      `).join('')}
      ${(device.publishers || []).map(p => `
        <button class="ctrl-btn ${p.state === 'streaming' ? 'ctrl-btn-red' : 'ctrl-btn-blue'}"
                onclick="cmd('/api/pearl/${device.id}/channel/${p.channelId}/publisher/${p.id}/${p.state === 'streaming' ? 'stop' : 'start'}')"

}

function renderRodecasterBody(device) {

    return Math.max(0, Math.min(100, ((lvl + 60) / 60) * 100));
  };

  return `
    <!-- USB connection bar -->

      <div class="cam-session-dot" style="background: ${isConnected ? 'var(--green)' : 'var(--red)'}"></div>
